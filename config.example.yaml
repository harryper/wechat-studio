# WeChat Studio 配置示例
# 敏感值只从环境变量读取，不要把真实密钥写入仓库。

# 微信公众号 API（发布草稿 + 数据统计必需）
wechat:
  appid: "${WECHAT_APPID}"
  secret: "${WECHAT_SECRET}"
  author: ""  # 默认署名（可选）

# AI 图片生成
# 支持 9 个 provider，配一个就能用，配多个自动 fallback。
#
# ┌─────────────────┬────────────────────────────────────────────────┬────────────────────┐
# │ Provider        │ 获取 API Key                                   │ 特点               │
# ├─────────────────┼────────────────────────────────────────────────┼────────────────────┤
# │ dashscope       │ https://dashscope.console.aliyun.com/          │ 阿里通义万相       │
# │ jimeng          │ https://console.volcengine.com/iam             │ 字节即梦，中文强   │
# │ minimax         │ https://platform.minimaxi.com/                 │ 国内 provider      │
# │ openai          │ https://platform.openai.com/api-keys           │ DALL-E，通用性强   │
# │ azure_openai    │ Azure Portal                                   │ 国内可访问的 OpenAI│
# │ gemini          │ https://aistudio.google.com/apikey             │ 免费额度较多       │
# │ openrouter      │ https://openrouter.ai/settings/keys            │ 多模型代理         │
# │ replicate       │ https://replicate.com/account/api-tokens       │ 开源模型丰富       │
# └─────────────────┴────────────────────────────────────────────────┴────────────────────┘
#
# 支持两种配置方式：

# 方式一：单 provider（简单用法，填一个就行）
# 默认建议优先 OpenAI；也可使用下方的 MiniMax 多供应商配置
image:
  provider: "openai"           # 见上表 Provider 列
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-image-2"
  # base_url: "https://api.openai.com/v1"  # 可选

# 方式二：多 provider 自动 fallback（推荐）
# 按顺序尝试，第一个失败自动切换下一个，不需要全部填写
# 每个条目可加 enabled 开关；值为 false / 0 / no / off 时跳过该 provider。
# 仓库默认把 openai 设成 enabled: "${OPENAI_IMAGE_ENABLED:-false}"，
# 不显式 export OPENAI_IMAGE_ENABLED=true 就不会产生 OpenAI 费用。
# image:
#   providers:
#     - provider: minimax
#       api_key: "${MINIMAX_API_KEY}"
#       model: "image-01"
#     - provider: openai
#       enabled: "${OPENAI_IMAGE_ENABLED:-false}"
#       api_key: "${OPENAI_API_KEY}"
#       model: "gpt-image-2"
#     - provider: dashscope
#       api_key: "${DASHSCOPE_API_KEY}"
#       # model: "qwen-image-2.0-pro"
#     - provider: jimeng
#       api_key: "${JIMENG_ACCESS_KEY}"      # 即梦需要 access_key_id + secret_key
#       secret_key: "${JIMENG_SECRET_KEY}"
#       # model: "jimeng_t2i_v40"
#     - provider: minimax
#       api_key: "${MINIMAX_API_KEY}"
#       # model: "image-01"
#     - provider: azure_openai
#       api_key: "${AZURE_OPENAI_API_KEY}"
#       base_url: "https://YOUR-RESOURCE.openai.azure.com/openai"  # 必填
#       # deployment: "gpt-image-2"
#     - provider: gemini
#       api_key: "${GEMINI_API_KEY}"
#       # model: "gemini-3.1-flash-image-preview"
#     - provider: openrouter
#       api_key: "${OPENROUTER_API_KEY}"
#       # model: "google/gemini-3.1-flash-image-preview"
#     - provider: replicate
#       api_key: "${REPLICATE_API_TOKEN}"
#       # model: "google/nano-banana-pro"

# 默认排版主题
theme: "professional-clean"
