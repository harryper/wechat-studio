# WeChat Studio 配置示例
# 敏感值只从环境变量读取，不要把真实密钥写入仓库。

# 微信公众号 API（发布草稿 + 数据统计必需）
wechat:
  appid: "${WECHAT_APPID}"
  secret: "${WECHAT_SECRET}"
  author: ""  # 默认署名（可选）

# AI 图片生成
# 供应商顺序由 .env 的 IMAGE_PROVIDER_ORDER 决定，取值为下方各条目的 id。
# 未设置时按 config.yaml 中 image.providers 的声明顺序回退。
image:
  providers:
    - id: cliproxy
      provider: "openai"
      api_key: "${CLIPROXY_IMAGE_API_KEY}"
      model: "gpt-image-2"
      base_url: "${CLIPROXY_IMAGE_BASE_URL:-http://127.0.0.1:8317/v1}"
    - id: seedream
      provider: "seedream"
      api_key: "${ARK_API_KEY}"
      model: "doubao-seedream-4-0-250828"
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
    - id: minimax
      provider: "minimax"
      api_key: "${MINIMAX_API_KEY}"
      model: "image-01"
      base_url: "https://api.minimaxi.com/v1"
    - id: openai
      provider: "openai"
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-image-2"
      base_url: "https://api.openai.com/v1"

# 默认排版主题
theme: "professional-clean"
