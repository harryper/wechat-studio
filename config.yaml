# WeChat Studio 配置（敏感值使用环境变量，不含明文密钥）
# 必填环境变量：
#   WECHAT_APPID       - 微信公众号 appid
#   WECHAT_SECRET      - 微信公众号 secret
#   OPENAI_API_KEY     - OpenAI API Key（用于 gpt-image-2）
#   MINIMAX_API_KEY    - MiniMax API Key（文章生成 + 图片生成）
#   ARK_API_KEY        - 火山方舟 API Key（用于 Doubao Seedream）
# 可选：
#   DASHSCOPE_API_KEY  - 阿里通义万相
#   JIMENG_ACCESS_KEY  - 即梦 access_key_id
#   JIMENG_SECRET_KEY  - 即梦 secret_access_key

wechat:
  appid: "${WECHAT_APPID}"
  secret: "${WECHAT_SECRET}"
  author: ""  # 默认署名（可选）

# AI 图片生成（供应商顺序由 .env 的 IMAGE_PROVIDER_ORDER 决定）
image:
  providers:
    - id: cliproxy
      provider: "openai"
      api_key: "${CLIPROXY_IMAGE_API_KEY}"
      model: "gpt-image-2"
      base_url: "${CLIPROXY_IMAGE_BASE_URL:-http://127.0.0.1:8317/v1}"
    - id: seedream
      provider: "seedream"
      api_key: "${ARK_API_KEY}"
      model: "doubao-seedream-4-0-250828"
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
    - id: minimax
      provider: "minimax"
      api_key: "${MINIMAX_API_KEY}"
      model: "image-01"
      base_url: "https://api.minimaxi.com/v1"
    - id: openai
      provider: "openai"
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-image-2"
      base_url: "https://api.openai.com/v1"

# 默认排版主题
theme: "terracotta"
