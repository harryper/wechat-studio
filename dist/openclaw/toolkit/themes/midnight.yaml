name: 暗夜
description: '粉紫蓝渐变 #F472B6/#8B5CF6/#60A5FA，赛博朋克霓虹光效，适合 AI/Web3/科技前沿话题'
colors:
  primary: '#333333'
  secondary: '#8B5CF6'
  text: '#333333'
  text_light: rgba(244,114,182,0.05)
  background: '#ffffff'
  code_bg: '#fbfbfd'
  code_color: '#e6e6e6'
  quote_border: '#8B5CF6'
  quote_bg: rgba(244,114,182,0.05)
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 22px;\n\
  \    font-weight: 700;\n    color: #ffffff;\n    text-align: center;\n    letter-spacing:\
  \ 0.1em;\n    line-height: 1.2;\n    background: linear-gradient(135deg, #F472B6\
  \ 0%, #8B5CF6 50%, #60A5FA 100%);\n    border-radius: 16px;\n    padding: 12px 24px;\n\
  \    margin-top: 22px;\n    margin-bottom: 16px;\n    box-shadow: 0 6px 20px rgba(244,114,182,0.25),\
  \ 0 2px 8px rgba(139,92,246,0.15);\n  }\n  h2 {\n    font-size: 20px;\n    font-weight:\
  \ 600;\n    color: #1d1d1f;\n    border-left: 4px solid #8B5CF6;\n    padding: 8px\
  \ 8px 8px 15px;\n    margin-top: 32px;\n    margin-bottom: 12px;\n    line-height:\
  \ 1.2;\n    border-bottom: 1px dashed #8B5CF6;\n  }\n  h3 {\n    font-size: 18px;\n\
  \    font-weight: 600;\n    color: #1d1d1f;\n    border-left: 3px solid #8B5CF6;\n\
  \    padding: 6px 6px 6px 13px;\n    margin-top: 28px;\n    margin-bottom: 12px;\n\
  \    line-height: 1.2;\n  }\n  p {\n    font-size: 15px;\n    color: #333333;\n\
  \    line-height: 1.8;\n    margin-top: 0;\n    margin-bottom: 19px;\n    letter-spacing:\
  \ 0.5px;\n    text-align: left;\n  }\n  blockquote {\n    border-left: 4px solid\
  \ #8B5CF6;\n    background: linear-gradient(135deg, rgba(244,114,182,0.05), rgba(168,85,247,0.02));\n\
  \    padding: 16px 19px;\n    margin-top: 24px;\n    margin-bottom: 24px;\n    border-radius:\
  \ 8px;\n    font-size: 15px;\n    color: #333333;\n    line-height: 1.7;\n  }\n\n\
  \  blockquote p {\n    margin: 8px 0;\n    color: #333333;\n  }\n  strong {\n  \
  \  font-weight: 600;\n    color: #7C3AED;\n  }\n  em {\n    font-style: italic;\n\
  \    color: #8B5CF6;\n  }\n  a {\n    color: #8B5CF6;\n    text-decoration: none;\n\
  \  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n    font-size:\
  \ 13px;\n    background: #fbfbfd;\n    color: #e6e6e6;\n    padding: 2px 6px;\n\
  \    border-radius: 4px;\n  }\n\n  pre {\n    background: #fbfbfd;\n    color: #e6e6e6;\n\
  \    padding: 16px;\n    border-radius: 6px;\n    overflow-x: auto;\n    margin:\
  \ 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background: none;\n \
  \   padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n    border-top:\
  \ 1px solid #8B5CF6;\n    margin: 28px auto;\n    width: 60%;\n  }\n  img {\n  \
  \  max-width: 100%;\n    height: auto;\n    display: block;\n    margin: 24px auto;\n\
  \    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#8B5CF6'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#8B5CF6'
