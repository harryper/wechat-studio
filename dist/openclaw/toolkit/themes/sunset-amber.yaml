name: 日落
description: '日落琥珀 #d37a45 温暖浓郁，渐变背景，适合故事/情感/旅行内容'
colors:
  primary: '#3d2c1e'
  secondary: '#d37a45'
  text: '#3d2c1e'
  text_light: '#f5e6d0'
  background: '#ffffff'
  code_bg: '#f5e6d0'
  code_color: '#e6e6e6'
  quote_border: '#d37a45'
  quote_bg: '#f5e6d0'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 29px;\n\
  \    font-weight: 700;\n    color: #8d4d2e;\n    text-align: center;\n    letter-spacing:\
  \ -0.015em;\n    line-height: 1.32;\n    background: linear-gradient(180deg, rgba(255,243,227,0.94)\
  \ 0%, rgba(248,228,201,0.8) 100%);\n    border-radius: 13px;\n    padding: 12px\
  \ 16px 11px;\n    margin-top: 36px;\n    margin-bottom: 18px;\n    box-shadow: 0\
  \ 6px 16px rgba(166,102,56,0.06);\n  }\n  h2 {\n    font-size: 23px;\n    font-weight:\
  \ 700;\n    color: #a45a33;\n    border-left: 3px solid #d78a54;\n    padding: 10px\
  \ 14px;\n    margin-top: 34px;\n    margin-bottom: 18px;\n    line-height: 1.4;\n\
  \  }\n  h3 {\n    font-size: 21px;\n    font-weight: 600;\n    color: #5c402b;\n\
  \    border-left: 3px solid rgba(215,138,84,0.9);\n    padding: 0 0 6px 12px;\n\
  \    margin-top: 28px;\n    margin-bottom: 14px;\n    line-height: 1.45;\n  }\n\
  \  p {\n    font-size: 15px;\n    color: #3d2c1e;\n    line-height: 1.75;\n    margin-top:\
  \ 0;\n    margin-bottom: 18px;\n    letter-spacing: 0.02em;\n    text-align: left;\n\
  \  }\n  blockquote {\n    border-left: 4px solid #d78a54;\n    background: linear-gradient(180deg,\
  \ rgba(249,236,217,0.96) 0%, rgba(247,228,204,0.88) 100%);\n    padding: 16px 20px;\n\
  \    margin-top: 24px;\n    margin-bottom: 24px;\n    border-radius: 12px;\n   \
  \ font-size: 15px;\n    color: rgba(211,122,69,0.7);\n    line-height: 1.75;\n \
  \ }\n\n  blockquote p {\n    margin: 8px 0;\n    color: rgba(211,122,69,0.7);\n\
  \  }\n  strong {\n    font-weight: 700;\n    color: #a45a33;\n  }\n  em {\n    font-style:\
  \ italic;\n    color: #8a6d4b;\n  }\n  a {\n    color: #d37a45;\n    text-decoration:\
  \ none;\n  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n\
  \    font-size: 13px;\n    background: #f5e6d0;\n    color: #e6e6e6;\n    padding:\
  \ 2px 6px;\n    border-radius: 4px;\n  }\n\n  pre {\n    background: #f5e6d0;\n\
  \    color: #e6e6e6;\n    padding: 16px;\n    border-radius: 6px;\n    overflow-x:\
  \ auto;\n    margin: 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background:\
  \ none;\n    padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n\
  \    border-top: 1px solid #d37a45;\n    margin: 28px auto;\n    width: 60%;\n \
  \ }\n  img {\n    max-width: 100%;\n    height: auto;\n    display: block;\n   \
  \ margin: 24px auto;\n    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#d37a45'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#d37a45'
