services:
  wechat-studio-web:
    build: .
    container_name: wechat-studio-web
    restart: unless-stopped
    ports:
      - "9997:9997"
    volumes:
      # Source code bind-mounted for live edits during dev.
      - ./webapp:/app/webapp
      - ./toolkit:/app/toolkit
      - ./scripts:/app/scripts
      - ./references:/app/references
      - ./clients:/app/clients:ro
      - ./config.yaml:/app/config.yaml:ro
      # xiaohu-wechat-format is a sibling skill in `skills/`, not part of
      # this repo. toolkit/xiaohu_formatter.py walks up 3 dirs from its
      # own location to find it; mount at /xiaohu-wechat-format so that
      # walk resolves inside the container.
      - ${XIAOHU_FORMAT_DIR:-../xiaohu-wechat-format}:/xiaohu-wechat-format:ro
      # Host-side logs are picked up by logrotate on the host.
      - /var/log/wechat-studio:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PATH=/usr/bin:/bin:/usr/local/bin
      - TZ=Asia/Shanghai
      - APP_PASSWORD=${APP_PASSWORD:-asdf123456}
      - APP_COOKIE_SECRET=${APP_COOKIE_SECRET:-wechat-studio-cookie-secret}
      # WeChat credentials (config.yaml references these via ${VAR} syntax).
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      # Image generation providers (image_gen.py uses these).
      - ARK_API_KEY=${ARK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # LLM endpoint for the knowledge-track article writer
      # (Anthropic-compatible Messages API).
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - GUNICORN_WORKERS=2
      - GUNICORN_TIMEOUT=300
      - GUNICORN_GRACEFUL_TIMEOUT=10
      - GUNICORN_KEEPALIVE=5
      - GUNICORN_MAX_REQUESTS=500
      - GUNICORN_MAX_REQUESTS_JITTER=100
      - GUNICORN_LOG_LEVEL=info
      # One background generation job per web worker; two Gunicorn workers
      # still allow two jobs concurrently without exhausting image memory.
      - WS_JOB_WORKERS=1
      - WS_JOB_MAX=${WS_JOB_MAX:-100}
      - WS_HISTORY_MAX=${WS_HISTORY_MAX:-10}
      - D1_API_URL=${D1_API_URL:-https://wechat-studio-data.harryperlau.workers.dev}
      - D1_API_TOKEN_FILE=/run/secrets/d1_api_token
    secrets:
      - d1_api_token
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.1"
          memory: 64M
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:9997/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  d1_api_token:
    file: ./.d1_api_token
