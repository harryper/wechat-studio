services:
  wechat-studio-web:
    build: .
    container_name: wechat-studio-web
    restart: unless-stopped
    ports:
      - "9997:9997"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Source code bind-mounted for live edits during dev.
      - ./webapp:/app/webapp
      - ./toolkit:/app/toolkit
      - ./scripts:/app/scripts
      - ./references:/app/references
      - ./clients:/app/clients:ro
      - ./config.yaml:/app/config.yaml:ro
      # xiaohu-wechat-format is a sibling skill in `skills/`, not part of
      # this repo. toolkit/xiaohu_formatter.py walks up 3 dirs from its
      # own location to find it; mount at /xiaohu-wechat-format so that
      # walk resolves inside the container.
      - ${XIAOHU_FORMAT_DIR:-../xiaohu-wechat-format}:/xiaohu-wechat-format:ro
      # Host-side logs are picked up by logrotate on the host.
      - /var/log/wechat-studio:/app/logs
    env_file:
      - .env
    environment:
      # 容器访问宿主机上的 cliproxyapi，取值必须与 .env 不同
      - CLIPROXY_IMAGE_BASE_URL=${CLIPROXY_IMAGE_BASE_URL:-http://host.docker.internal:8317/v1}
    secrets:
      - d1_api_token
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.1"
          memory: 64M
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:9997/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  d1_api_token:
    file: ./.d1_api_token
