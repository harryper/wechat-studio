# 30 岁前应内化的认知模型主题库
#
# 用途：Step 2 主题库轮转的主数据源。
# 结构：6 类 × 5 个模型，共 30 个主题，按 kb-001 ~ kb-030 顺序轮转。
# 行文：每个模型只写一篇，key_points 依次合并原理、证据、应用与边界。
#
# 类别枚举：
#   - understanding_world  认识世界
#   - decision_making      做决策
#   - probability          理解概率
#   - human_nature         理解人性
#   - long_term_growth     长期发展
#   - self_knowledge       理解自己

# 1. 认识世界
- id: kb-001
  title: 第一性原理
  category: understanding_world
  key_points:
    - 原理：剥离惯例与类比，从不可再拆的事实、约束和目标重新推导方案
    - 证据：亚里士多德讨论第一原理，现代工程与科学方法延续了这种还原路径
    - 应用：面对产品、职业或成本问题时，先列事实与硬约束，再重新设计选择
    - 边界：复杂社会系统很难完全还原，忽略历史经验与隐性约束会产生伪确定性
  origin: 源自亚里士多德对第一原理的讨论，后成为科学与工程推理的重要方法
  caution: "no"

- id: kb-002
  title: 二阶思维
  category: understanding_world
  key_points:
    - 原理：不止判断行动的直接结果，还继续追问后续反应、反馈与连锁后果
    - 证据：Jay Forrester 的系统动力学模型展示了延迟与反馈如何让短期政策产生反直觉后果
    - 应用：降价、加薪、转岗或制定政策前，至少推演下一步和再下一步会发生什么
    - 边界：推演层级越多不等于越准确，应给关键假设标注概率并及时停止空想
  origin: 并非单一学者提出，源于战略推演、经济学与系统思维中的后果分析
  caution: "no"

- id: kb-003
  title: 系统思维
  category: understanding_world
  key_points:
    - 原理：把结果视为要素、反馈回路、延迟、瓶颈和非线性共同作用的产物
    - 证据：控制论与系统动力学研究显示，单点优化常被反馈抵消甚至造成反效果
    - 应用：分析组织、健康或关系问题时，画出变量之间的循环影响与时间延迟
    - 边界：系统图只是现实的简化模型，变量过多会让分析失去可验证性与行动性
  origin: 20 世纪一般系统论、控制论与系统动力学共同发展出的跨学科方法
  caution: "no"

- id: kb-004
  title: 激励机制
  category: understanding_world
  key_points:
    - 原理：个体和组织会对收益、成本、评价与惩罚结构作出适应性反应
    - 证据：Jensen 与 Meckling 1976 年的委托代理模型系统说明了利益不一致如何改变代理人行为
    - 应用：理解政策、公司或他人行为时，检查谁因什么获益以及谁承担代价
    - 边界：人并非只受物质利益驱动，身份、道德、关系和内在动机同样重要
  origin: 贯穿古典经济学、机制设计与现代组织理论，没有唯一的首次提出者
  caution: "no"

- id: kb-005
  title: 古德哈特定律
  category: understanding_world
  key_points:
    - 原理：当代理指标被直接设为目标，人们会优化指标并削弱它对真实目标的代表性
    - 证据：教育应试、代码行数考核和平台点击率优化都呈现指标替代目标的问题
    - 应用：设计 KPI 时同时检查反指标、质量约束和可能被钻空子的行为路径
    - 边界：定律并不意味着放弃量化，而是要求多指标校验并持续审视指标有效性
  origin: 英国经济学家 Charles Goodhart 于 1975 年讨论货币政策指标时提出
  caution: "no"

# 2. 做决策
- id: kb-006
  title: 机会成本
  category: decision_making
  key_points:
    - 原理：一项选择的真实成本包含因此放弃的最佳替代方案所能带来的价值
    - 证据：稀缺资源配置理论表明，时间、注意力和资本无法同时投入所有选项
    - 应用：比较工作、学习或投资方案时，明确写下选择它所放弃的最佳替代项
    - 边界：替代方案价值常不确定，不能把事后才知道的结果冒充当时可见的成本
  origin: 19 世纪末至 20 世纪初由奥地利学派等经济学传统逐步系统化
  caution: "no"

- id: kb-007
  title: 沉没成本
  category: decision_making
  key_points:
    - 原理：已经发生且无法收回的投入不应影响只关乎未来收益与成本的选择
    - 证据：行为实验和现实决策反复发现，人会因既有投入而继续低价值项目
    - 应用：犹豫是否退出时，改问如果今天第一次面对它，我还会不会投入
    - 边界：历史投入若形成技能、信誉或退出代价，就仍会影响未来价值而非纯沉没
  origin: 源自经济学成本理论，后由行为经济学系统研究沉没成本谬误
  caution: "no"

- id: kb-008
  title: 可逆与不可逆决策
  category: decision_making
  key_points:
    - 原理：可低成本撤销的决定应快速试验，难以撤销的决定应提高信息门槛
    - 证据：Amazon 2015 年股东信以单向门和双向门区分决策，是该方法的典型组织实践案例
    - 应用：先判断退出成本、影响范围和恢复时间，再决定是快速行动还是慢速审议
    - 边界：可逆性并非二元属性，还会随时间、规模和依赖关系变化，需要动态重估
  origin: 广泛见于管理学与决策实践，常被概括为双向门和单向门决策
  caution: "no"

- id: kb-009
  title: 帕累托法则
  category: decision_making
  key_points:
    - 原理：许多系统的投入与产出高度不均，少数关键因素贡献大部分结果
    - 证据：帕累托观察财富分布后，类似长尾与幂律结构在多领域被反复发现
    - 应用：复盘工作或业务时，识别真正决定结果的少数客户、动作与瓶颈
    - 边界：八十与二十不是固定比例，也不能据此忽视基本保障和长尾风险
  origin: Vilfredo Pareto 于 19 世纪末研究财富分布，后被推广为 80/20 法则
  caution: "no"

- id: kb-010
  title: 逆向思维
  category: decision_making
  key_points:
    - 原理：除寻找成功路径外，先识别必然导致失败的条件并主动避开
    - 证据：可靠性工程、事故复盘和风险管理都通过失败模式反推预防措施
    - 应用：为健康、项目或投资列出会造成灾难的行为，再建立不可触碰的底线
    - 边界：只做防错可能压制探索与创新，避免大错之后仍需主动寻找正向机会
  origin: 源于数学反证、工程故障分析与决策实践，后因芒格等人的倡导而普及
  caution: "no"

# 3. 理解概率
- id: kb-011
  title: 幸存者偏差
  category: probability
  key_points:
    - 原理：只观察成功留下的样本会忽略失败者，从而高估某种路径的有效性
    - 证据：二战期间 Abraham Wald 分析返航飞机弹孔，指出应关注未返航样本
    - 应用：听取创业、投资或职业经验时，主动寻找失败样本与完整样本空间
    - 边界：发现样本缺失不等于反向结论必然正确，仍需获得可比较的数据
  origin: 以二战期间 Abraham Wald 对军机损伤数据的分析最为著名
  caution: "no"

- id: kb-012
  title: 基准率
  category: probability
  key_points:
    - 原理：判断个案之前应先看同类事件的总体发生率，再叠加个案信息
    - 证据：心理学实验显示，生动人物描述常让人忽视职业比例等先验分布
    - 应用：评估创业、疾病或招聘判断时，先查同类群体的基础成功率或发生率
    - 边界：基准率必须来自可比群体，过宽、过旧或选择错误的参考类会误导判断
  origin: 源于概率统计中的先验概率，并由 Kahneman、Tversky 等研究基准率忽视
  caution: "no"

- id: kb-013
  title: 贝叶斯思维
  category: probability
  key_points:
    - 原理：以原有判断为先验，根据新证据的区分能力持续更新可信度
    - 证据：贝叶斯定理给出规范更新方式，医学检测等案例显示忽略先验会严重误判
    - 应用：把观点写成概率，遇到新信息时追问它在不同假设下出现的可能性
    - 边界：垃圾先验与相关证据会产生精确的错误，更新质量取决于输入质量
  origin: Thomas Bayes 的思想经 Richard Price 于 1763 年整理发表，后发展成统计体系
  caution: "no"

- id: kb-014
  title: 期望值
  category: probability
  key_points:
    - 原理：用各种结果与其概率的加权和比较长期重复决策的平均价值
    - 证据：概率论与决策理论表明，单次输赢不能代表一个重复选择的长期质量
    - 应用：比较投资或项目时，列出主要结果、概率、收益损失与重复次数
    - 边界：期望值不会反映现金流、风险承受力和极端尾部损失，不能单独使用
  origin: 17 世纪概率论发展后形成，Bernoulli 又以效用修正金钱期望的局限
  caution: "no"

- id: kb-015
  title: 避免出局
  category: probability
  key_points:
    - 原理：长期游戏首先要限制单次失败规模，确保坏结果后仍有继续参与的能力
    - 证据：经典赌徒破产模型证明，有限本金在重复随机博弈中存在可计算的最终出局概率
    - 应用：投资、创业、职业与健康决策先设最大损失、冗余和恢复空间
    - 边界：过度追求绝不出局会放弃必要风险，应控制毁灭性风险而非消灭所有波动
  origin: 源于赌徒破产问题、保险精算、资金管理与安全工程中的生存约束
  caution: "no"

# 4. 理解人性
- id: kb-016
  title: 确认偏误
  category: human_nature
  key_points:
    - 原理：人更容易寻找、解释和记住支持既有信念的信息，忽略反面证据
    - 证据：Peter Wason 的选择任务及后续研究展示了验证偏好与证伪困难
    - 应用：形成观点后主动写下什么证据会证明自己错，并寻找最强反方材料
    - 边界：坚持已有判断不总是偏误；当证据稳定时频繁摇摆同样会降低质量
  origin: 1960 年 Peter Wason 的规则发现实验推动了确认偏误的系统研究
  caution: "no"

- id: kb-017
  title: 基本归因错误
  category: human_nature
  key_points:
    - 原理：解释他人行为时容易高估性格因素，低估情境压力与环境约束
    - 证据：Jones 与 Harris 等人的实验发现，人即使知道立场受指派仍会推断作者态度
    - 应用：评价同事、伴侣或陌生人前，先列出可能影响其行为的情境变量
    - 边界：强调情境不等于取消个人责任，稳定重复的行为仍可能反映人格差异
  origin: 由社会心理学家 Lee Ross 于 1977 年命名并系统阐述
  caution: "no"

- id: kb-018
  title: 损失厌恶
  category: human_nature
  key_points:
    - 原理：相对于参考点，同等损失通常比同等收益带来更强烈的心理影响
    - 证据：Kahneman 与 Tversky 的前景理论实验展示了收益与损失的不对称评价
    - 应用：止损、谈判或产品设计时，检查恐惧失去是否扭曲了真实价值判断
    - 边界：损失敏感程度因情境与个体而异，不能机械套用固定倍数解释所有选择
  origin: Kahneman 与 Tversky 于 1979 年在前景理论中正式提出
  caution: "no"

- id: kb-019
  title: 峰终定律
  category: human_nature
  key_points:
    - 原理：人对一段经历的总体记忆常由情绪峰值和结束阶段显著塑造
    - 证据：Kahneman 等人的疼痛实验发现，结束稍缓和的较长体验可能获得更好评价
    - 应用：设计会议、服务、旅行或关系互动时，重点照顾关键时刻与收尾体验
    - 边界：峰终定律不适用于所有评价，持续时长、频率和近期体验也可能重要
  origin: 由 Daniel Kahneman、Barbara Fredrickson 等人在 1990 年代的研究推动形成
  caution: "no"

- id: kb-020
  title: 社会比较
  category: human_nature
  key_points:
    - 原理：人会通过与他人比较能力、处境和资源来形成自我评价与满足感
    - 证据：Festinger 的社会比较理论及后续研究显示，比较方向影响情绪与动机
    - 应用：使用社交媒体或设定目标时，识别比较对象、可比性和比较带来的行为
    - 边界：比较并非全然有害，选择可比且可学习的参照能提供反馈与行动线索
  origin: Leon Festinger 于 1954 年系统提出社会比较理论
  caution: "no"

# 5. 长期发展
- id: kb-021
  title: 复利效应
  category: long_term_growth
  key_points:
    - 原理：可持续积累且能再次参与增长的微小收益，会随时间形成非线性差距
    - 证据：金融复利可被数学直接验证，技能、信誉与习惯也常呈现累积反馈
    - 应用：选择能够长期重复、反馈及时并可沉淀资产的学习、健康和工作行为
    - 边界：生活领域不是固定利率模型，中断、上限、环境变化与负复利都存在
  origin: 复利数学源远流长，后被广泛借用来解释长期累积与反馈效应
  caution: "no"

- id: kb-022
  title: 路径依赖
  category: long_term_growth
  key_points:
    - 原理：早期选择会改变后续成本、能力和可选集合，使发展沿特定轨道强化
    - 证据：技术标准与制度经济学案例显示，先发采用和转换成本会锁定后续路径
    - 应用：评估职业或平台选择时，不只看当前收益，还看它将打开和关闭哪些门
    - 边界：路径会约束但不必然决定未来，重大技术、资源或制度变化可能打破锁定
  origin: 由经济史、制度经济学与技术变迁研究在 20 世纪后期系统化
  caution: "no"

- id: kb-023
  title: 能力圈
  category: long_term_growth
  key_points:
    - 原理：知道自己真正理解的领域与未知边界，比假装全知更能提高决策质量
    - 证据：专业判断研究表明，经验只有在反馈稳定的环境中才更可能形成可靠直觉
    - 应用：重大下注前区分已知、未知和不可知，并在圈外缩小规模或寻求验证
    - 边界：能力圈不是永久舒适区，需要通过学习和小规模试验持续向外扩展
  origin: 由投资实践推广，Warren Buffett 与 Charlie Munger 对其阐述最为知名
  caution: "no"

- id: kb-024
  title: 杠杆
  category: long_term_growth
  key_points:
    - 原理：借助资本、代码、媒体、组织与工具，让一次投入产生可复制的更大产出
    - 证据：工业化、软件和大众传播都展示了边际复制成本下降带来的规模效应
    - 应用：工作规划时优先建设可复用系统、自动化工具、内容资产与协作机制
    - 边界：杠杆同时放大错误、债务和声誉风险，规模扩大前必须建立质量反馈
  origin: 概念源自物理机械，后被金融、商业与个人生产力领域广泛借用
  caution: "no"

- id: kb-025
  title: 比较优势
  category: long_term_growth
  key_points:
    - 原理：分工应比较相对机会成本，而不只是比较谁在某项能力上绝对更强
    - 证据：Ricardo 的贸易模型证明，即使一方全面更强，按相对优势分工仍可互利
    - 应用：职业定位时寻找独特能力组合，以及自己相对更低成本的高价值工作
    - 边界：模型假设转换与交易成本有限，现实还要考虑学习潜力、权力和风险
  origin: David Ricardo 于 1817 年系统阐述比较优势理论
  caution: "no"

# 6. 理解自己
- id: kb-026
  title: 控制二分法
  category: self_knowledge
  key_points:
    - 原理：区分可控制与不可控制之事，把精力集中在判断、选择与行动上
    - 证据：斯多葛哲学文本与现代心理干预都强调控制感边界对情绪调节的意义
    - 应用：焦虑时列出能做的下一步、能影响的因素和必须接受的外部结果
    - 边界：控制程度常是连续谱，把可影响之事误判为不可控会滑向消极放弃
  origin: 古希腊斯多葛哲学家 Epictetus 在《手册》中作出经典阐述
  caution: "no"

- id: kb-027
  title: 享乐适应
  category: self_knowledge
  key_points:
    - 原理：重大好坏变化后的情绪影响常会减弱，人逐渐回到相对稳定的水平
    - 证据：彩票中奖者、生活事件与主观幸福感研究支持适应存在但程度并不相同
    - 应用：规划生活时减少对一次性升级的幻想，增加关系、体验和日常过程投入
    - 边界：人不会对所有处境完全适应，慢性疼痛、失业等影响可能长期持续
  origin: 20 世纪后半叶幸福感研究发展出的概念，也常被称为享乐跑步机
  caution: "no"

- id: kb-028
  title: 身份认同驱动
  category: self_knowledge
  key_points:
    - 原理：当行为与自我身份一致时，更容易通过重复反馈形成稳定习惯
    - 证据：Bem 1972 年的自我知觉理论与后续身份动机研究表明，人会从行为反推并维护自我概念
    - 应用：把我要完成某事改写为我想成为什么样的人，并设计最小一致行动
    - 边界：身份标签过强会制造僵化和自我辩护，应允许身份随证据与阶段更新
  origin: 综合自我知觉、社会认同与行为习惯研究形成的实践性模型
  caution: "no"

- id: kb-029
  title: 选择悖论
  category: self_knowledge
  key_points:
    - 原理：选项增加到一定程度后，会提高比较成本、后悔与放弃决策的概率
    - 证据：部分消费实验观察到选择过载，但后续研究表明效果依赖任务与情境
    - 应用：为低价值决定设置默认项和足够好标准，把注意力留给真正重要的选择
    - 边界：更多选择并非总会降低幸福，熟悉领域和偏好清晰者可能从中受益
  origin: 由 Barry Schwartz 等人推广，建立在选择过载相关研究之上
  caution: "yes"

- id: kb-030
  title: 有限游戏与无限游戏
  category: self_knowledge
  key_points:
    - 原理：有限游戏追求按规则赢一次，无限游戏优先维持继续参与和演化的能力
    - 证据：Carse 的论述属于概念分析而非实证定律，其价值在于检查短期胜负与长期持续性的冲突
    - 应用：做长期选择时检查这次胜利是否损害信誉、健康、关系或未来选择权
    - 边界：它是哲学框架而非可证伪定律，现实任务常同时包含有限和无限目标
  origin: James P. Carse 于 1986 年在《有限与无限的游戏》中系统阐述
  caution: "yes"
