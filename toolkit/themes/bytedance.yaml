name: 字节蓝
description: '字节蓝青渐变 #1677FF/#05D4CD，渐变胶囊标题，科技商务感，适合 SaaS 产品、技术方案介绍'
colors:
  primary: '#1d2129'
  secondary: '#1677FF'
  text: '#1d2129'
  text_light: '#f2f3f5'
  background: '#ffffff'
  code_bg: '#f7f8fa'
  code_color: '#e6e6e6'
  quote_border: '#1677FF'
  quote_bg: '#f2f3f5'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 22px;\n\
  \    font-weight: 600;\n    color: #1d2129;\n    text-align: center;\n    letter-spacing:\
  \ 0.1em;\n    line-height: 1.2;\n    background: linear-gradient(to right, rgba(22,119,255,0.02),\
  \ rgba(5,212,205,0.05), rgba(22,119,255,0.02));\n    border-radius: 4px;\n    padding:\
  \ 10px 24px;\n    margin-top: 24px;\n    margin-bottom: 24px;\n  }\n  h2 {\n   \
  \ font-size: 20px;\n    font-weight: 600;\n    color: #ffffff;\n    border-left:\
  \ 4px solid #1677FF;\n    padding: 6px 22px;\n    margin-top: 48px;\n    margin-bottom:\
  \ 24px;\n    line-height: 1.4;\n  }\n  h3 {\n    font-size: 18px;\n    font-weight:\
  \ 600;\n    color: #1677FF;\n    border-left: 3px solid #1677FF;\n    padding: 8px\
  \ 16px 8px 12px;\n    margin-top: 32px;\n    margin-bottom: 12px;\n    line-height:\
  \ 1.6;\n  }\n  p {\n    font-size: 15px;\n    color: #4e5969;\n    line-height:\
  \ 1.8;\n    margin-top: 0;\n    margin-bottom: 19px;\n    letter-spacing: 0.5px;\n\
  \    text-align: left;\n  }\n  blockquote {\n    border-left: 4px solid #05D4CD;\n\
  \    background: #f2f3f5;\n    padding: 16px 16px 16px 32px;\n    margin-top: 24px;\n\
  \    margin-bottom: 24px;\n    border-radius: 6px;\n    font-size: 15px;\n    color:\
  \ #4e5969;\n    line-height: 1.8;\n  }\n\n  blockquote p {\n    margin: 8px 0;\n\
  \    color: #4e5969;\n  }\n  strong {\n    font-weight: 600;\n    color: #1677FF;\n\
  \  }\n  em {\n    font-style: italic;\n    color: #05D4CD;\n  }\n  a {\n    color:\
  \ #1677FF;\n    text-decoration: none;\n  }\n  code {\n    font-family: \"SF Mono\"\
  , Menlo, Consolas, monospace;\n    font-size: 13px;\n    background: #f7f8fa;\n\
  \    color: #e6e6e6;\n    padding: 2px 6px;\n    border-radius: 4px;\n  }\n\n  pre\
  \ {\n    background: #f7f8fa;\n    color: #e6e6e6;\n    padding: 16px;\n    border-radius:\
  \ 6px;\n    overflow-x: auto;\n    margin: 16px 0;\n    line-height: 1.6;\n  }\n\
  \n  pre code {\n    background: none;\n    padding: 0;\n    border-radius: 0;\n\
  \  }\n  hr {\n    border: none;\n    border-top: 1px solid #1677FF;\n    margin:\
  \ 28px auto;\n    width: 60%;\n  }\n  img {\n    max-width: 100%;\n    height: auto;\n\
  \    display: block;\n    margin: 24px auto;\n    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#1677FF'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#1677FF'
