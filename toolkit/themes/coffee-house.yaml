name: 咖啡
description: '咖啡棕 #8d6e63 沉稳温暖，衬线字体感，适合读书/文化/深度内容'
colors:
  primary: '#3e2723'
  secondary: '#8d6e63'
  text: '#3e2723'
  text_light: '#ece2d4'
  background: '#ffffff'
  code_bg: '#ece2d4'
  code_color: '#e6e6e6'
  quote_border: '#8d6e63'
  quote_bg: '#ece2d4'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 29px;\n\
  \    font-weight: 700;\n    color: #4a302a;\n    text-align: center;\n    letter-spacing:\
  \ -0.015em;\n    line-height: 1.32;\n    background: linear-gradient(180deg, rgba(236,226,212,0.92)\
  \ 0%, rgba(245,239,230,0.94) 100%);\n    border-radius: 12px;\n    padding: 12px\
  \ 16px 11px;\n    margin-top: 36px;\n    margin-bottom: 18px;\n  }\n  h2 {\n   \
  \ font-size: 22px;\n    font-weight: 700;\n    color: #5d4037;\n    border-left:\
  \ none;\n    padding: 0 0 8px;\n    margin-top: 34px;\n    margin-bottom: 18px;\n\
  \    line-height: 1.45;\n    border-bottom: 1px solid rgba(161,136,127,0.36);\n\
  \  }\n  h3 {\n    font-size: 20px;\n    font-weight: 600;\n    color: #4e342e;\n\
  \    border-left: 3px solid rgba(141,110,99,0.7);\n    padding: 0 0 6px 12px;\n\
  \    margin-top: 28px;\n    margin-bottom: 14px;\n    line-height: 1.45;\n  }\n\
  \  p {\n    font-size: 15px;\n    color: #3e2723;\n    line-height: 1.75;\n    margin-top:\
  \ 0;\n    margin-bottom: 18px;\n    letter-spacing: 0.02em;\n    text-align: left;\n\
  \  }\n  blockquote {\n    border-left: 4px solid #8d6e63;\n    background: linear-gradient(180deg,\
  \ rgba(236,226,212,0.96) 0%, rgba(245,239,230,0.96) 100%);\n    padding: 16px 20px;\n\
  \    margin-top: 24px;\n    margin-bottom: 24px;\n    border-radius: 12px;\n   \
  \ font-size: 15px;\n    color: rgba(141,110,99,0.7);\n    line-height: 1.75;\n \
  \ }\n\n  blockquote p {\n    margin: 8px 0;\n    color: rgba(141,110,99,0.7);\n\
  \  }\n  strong {\n    font-weight: 700;\n    color: #5d4037;\n  }\n  em {\n    font-style:\
  \ italic;\n    color: #795548;\n  }\n  a {\n    color: #8d6e63;\n    text-decoration:\
  \ none;\n  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n\
  \    font-size: 13px;\n    background: #ece2d4;\n    color: #e6e6e6;\n    padding:\
  \ 2px 6px;\n    border-radius: 4px;\n  }\n\n  pre {\n    background: #ece2d4;\n\
  \    color: #e6e6e6;\n    padding: 16px;\n    border-radius: 6px;\n    overflow-x:\
  \ auto;\n    margin: 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background:\
  \ none;\n    padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n\
  \    border-top: 1px solid #8d6e63;\n    margin: 28px auto;\n    width: 60%;\n \
  \ }\n  img {\n    max-width: 100%;\n    height: auto;\n    display: block;\n   \
  \ margin: 24px auto;\n    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#8d6e63'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#8d6e63'
