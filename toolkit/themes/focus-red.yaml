name: 聚焦·红
description: '聚焦红 #F25C54 居中标题+上下线，适合品牌/展示/营销内容'
colors:
  primary: '#2c2c2c'
  secondary: '#F25C54'
  text: '#2c2c2c'
  text_light: rgba(242,92,84,0.05)
  background: '#ffffff'
  code_bg: '#282c34'
  code_color: '#e6e6e6'
  quote_border: '#F25C54'
  quote_bg: rgba(242,92,84,0.05)
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 26px;\n\
  \    font-weight: 700;\n    color: #F25C54;\n    text-align: center;\n    letter-spacing:\
  \ 0;\n    line-height: 1.4;\n    background: #F25C54;\n    border-radius: 8px;\n\
  \    padding: 16px 0;\n    margin-top: 0;\n    margin-bottom: 28px;\n  }\n  h2 {\n\
  \    font-size: 22px;\n    font-weight: 700;\n    color: #F25C54;\n    border-left:\
  \ 4px solid #F25C54;\n    padding: 12px 0;\n    margin-top: 36px;\n    margin-bottom:\
  \ 24px;\n    line-height: 1.35;\n  }\n  h3 {\n    font-size: 20px;\n    font-weight:\
  \ 600;\n    color: #F25C54;\n    border-left: 3px solid #F25C54;\n    padding: 10px\
  \ 0;\n    margin-top: 28px;\n    margin-bottom: 20px;\n    line-height: 1.4;\n \
  \ }\n  p {\n    font-size: 15px;\n    color: #2c2c2c;\n    line-height: 1.75;\n\
  \    margin-top: 0;\n    margin-bottom: 20px;\n    letter-spacing: 0.02em;\n   \
  \ text-align: left;\n  }\n  blockquote {\n    border-left: 5px solid #F25C54;\n\
  \    background: rgba(242,92,84,0.05);\n    padding: 16px 8px 1px 8px;\n    margin-top:\
  \ 4px;\n    margin-bottom: 20px;\n    border-radius: 6px;\n    font-size: 15px;\n\
  \    color: rgba(0,0,0,0.6);\n    line-height: 1.7;\n    font-style: italic;\n \
  \ }\n\n  blockquote p {\n    margin: 8px 0;\n    color: rgba(0,0,0,0.6);\n  }\n\
  \  strong {\n    font-weight: 700;\n    color: #F25C54;\n  }\n  em {\n    font-style:\
  \ italic;\n    color: #666666;\n  }\n  a {\n    color: #F25C54;\n    text-decoration:\
  \ none;\n  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n\
  \    font-size: 13px;\n    background: #282c34;\n    color: #e6e6e6;\n    padding:\
  \ 2px 6px;\n    border-radius: 4px;\n  }\n\n  pre {\n    background: #282c34;\n\
  \    color: #e6e6e6;\n    padding: 16px;\n    border-radius: 6px;\n    overflow-x:\
  \ auto;\n    margin: 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background:\
  \ none;\n    padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n\
  \    border-top: 1px solid #F25C54;\n    margin: 28px auto;\n    width: 60%;\n \
  \ }\n  img {\n    max-width: 100%;\n    height: auto;\n    display: block;\n   \
  \ margin: 24px auto;\n    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#F25C54'
  code_bg: '#2a2a2a'
