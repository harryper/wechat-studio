name: 清新卡片
description: '春日嫩绿 #6b9b7a 强调，淡绿底+卡片布局+点状纹理+清新阴影，适合生活方式、自然主题'
colors:
  primary: '#3d4a3d'
  secondary: '#6b9b7a'
  text: '#3d4a3d'
  text_light: '#e8f0e8'
  background: '#f5f8f5'
  code_bg: '#3B3B3B'
  code_color: '#e6e6e6'
  quote_border: '#6b9b7a'
  quote_bg: '#e8f0e8'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #f5f8f5;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 22px;\n\
  \    font-weight: bold;\n    color: #3d4a3d;\n    text-align: center;\n    letter-spacing:\
  \ 0;\n    line-height: 1.3;\n    background: #6b9b7a;\n    border-radius: 8px;\n\
  \    padding: 16px 24px;\n    margin-top: 0;\n    margin-bottom: 12px;\n  }\n  h2\
  \ {\n    font-size: 20px;\n    font-weight: bold;\n    color: #6b9b7a;\n    border-left:\
  \ 4px solid #6b9b7a;\n    padding: 0 0 10px 0;\n    margin-top: 32px;\n    margin-bottom:\
  \ 16px;\n    line-height: 1.3;\n    border-bottom: 1px dashed rgba(74,128,88,0.3);\n\
  \  }\n  h3 {\n    font-size: 18px;\n    font-weight: bold;\n    color: #6b9b7a;\n\
  \    border-left: 3px solid #6b9b7a;\n    padding: 0 0 6px 0;\n    margin-top: 28px;\n\
  \    margin-bottom: 12px;\n    line-height: 1.3;\n  }\n  p {\n    font-size: 15px;\n\
  \    color: #3d4a3d;\n    line-height: 1.75;\n    margin-top: 0;\n    margin-bottom:\
  \ 20px;\n    letter-spacing: 0.5px;\n    text-align: justify;\n  }\n  blockquote\
  \ {\n    border-left: 5px solid #6b9b7a;\n    background: #e8f0e8;\n    padding:\
  \ 15px 20px;\n    margin-top: 20px;\n    margin-bottom: 20px;\n    border-radius:\
  \ 0 12px 12px 0;\n    font-size: 15px;\n    color: #3d4a3d;\n    line-height: 1.75;\n\
  \    font-style: italic;\n    box-shadow: inset 0 0 15px rgba(107,155,122,0.1);\n\
  \  }\n\n  blockquote p {\n    margin: 8px 0;\n    color: #3d4a3d;\n  }\n  strong\
  \ {\n    font-weight: bold;\n    color: #4a8058;\n  }\n  em {\n    font-style: italic;\n\
  \    color: #666666;\n  }\n  a {\n    color: #6b9b7a;\n    text-decoration: none;\n\
  \  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n    font-size:\
  \ 13px;\n    background: #3B3B3B;\n    color: #e6e6e6;\n    padding: 2px 6px;\n\
  \    border-radius: 4px;\n  }\n\n  pre {\n    background: #3B3B3B;\n    color: #e6e6e6;\n\
  \    padding: 16px;\n    border-radius: 6px;\n    overflow-x: auto;\n    margin:\
  \ 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background: none;\n \
  \   padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n    border-top:\
  \ 1px solid #6b9b7a;\n    margin: 28px auto;\n    width: 60%;\n  }\n  img {\n  \
  \  max-width: 100%;\n    height: auto;\n    display: block;\n    margin: 24px auto;\n\
  \    border-radius: 4px;\n  }"
