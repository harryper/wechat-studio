name: GitHub
description: 'GitHub 蓝 #0969DA 强调，灰色边框系统，白底开发者风格，适合技术博客、代码分享'
colors:
  primary: '#1f2328'
  secondary: '#0969da'
  text: '#1f2328'
  text_light: '#f6f8fa'
  background: '#ffffff'
  code_bg: '#f6f8fa'
  code_color: '#e6e6e6'
  quote_border: '#0969da'
  quote_bg: '#f6f8fa'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 29px;\n\
  \    font-weight: 700;\n    color: #1f2328;\n    text-align: center;\n    letter-spacing:\
  \ 0;\n    line-height: 1.26;\n    background: linear-gradient(180deg, #f8fbff 0%,\
  \ #f6f8fa 100%);\n    border-radius: 10px;\n    padding: 12px 16px 11px;\n    margin-top:\
  \ 36px;\n    margin-bottom: 18px;\n    box-shadow: 0 1px 0 rgba(31,35,40,0.04);\n\
  \  }\n  h2 {\n    font-size: 23px;\n    font-weight: 700;\n    color: #1f2328;\n\
  \    border-left: 4px solid #0969da;\n    padding: 0 0 10px 0;\n    margin-top:\
  \ 34px;\n    margin-bottom: 18px;\n    line-height: 1.35;\n    border-bottom: 2px\
  \ solid #d8dee4;\n  }\n  h3 {\n    font-size: 21px;\n    font-weight: 600;\n   \
  \ color: #1f2328;\n    border-left: 3px solid #218bff;\n    padding: 0 0 6px 12px;\n\
  \    margin-top: 28px;\n    margin-bottom: 14px;\n    line-height: 1.4;\n  }\n \
  \ p {\n    font-size: 15px;\n    color: #1f2328;\n    line-height: 1.6;\n    margin-top:\
  \ 0;\n    margin-bottom: 16px;\n    letter-spacing: 0.5px;\n    text-align: left;\n\
  \  }\n  blockquote {\n    border-left: 4px solid #218bff;\n    background: #f6f8fa;\n\
  \    padding: 14px 16px;\n    margin-top: 18px;\n    margin-bottom: 18px;\n    border-radius:\
  \ 10px;\n    font-size: 16px;\n    color: #57606a;\n    line-height: 1.6;\n  }\n\
  \n  blockquote p {\n    margin: 8px 0;\n    color: #57606a;\n  }\n  strong {\n \
  \   font-weight: 600;\n    color: #0550ae;\n  }\n  em {\n    font-style: italic;\n\
  \    color: #1f2328;\n  }\n  a {\n    color: #0969da;\n    text-decoration: none;\n\
  \  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n    font-size:\
  \ 13px;\n    background: #f6f8fa;\n    color: #e6e6e6;\n    padding: 2px 6px;\n\
  \    border-radius: 4px;\n  }\n\n  pre {\n    background: #f6f8fa;\n    color: #e6e6e6;\n\
  \    padding: 16px;\n    border-radius: 6px;\n    overflow-x: auto;\n    margin:\
  \ 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background: none;\n \
  \   padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n    border-top:\
  \ 1px solid #0969da;\n    margin: 28px auto;\n    width: 60%;\n  }\n  img {\n  \
  \  max-width: 100%;\n    height: auto;\n    display: block;\n    margin: 24px auto;\n\
  \    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#0969da'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#0969da'
