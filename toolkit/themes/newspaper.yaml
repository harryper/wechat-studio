name: 报纸
description: '纽约时报风 #326891 蓝灰，Georgia 衬线体，居中双线标题，适合新闻评论、行业分析'
colors:
  primary: '#000000'
  secondary: '#326891'
  text: '#000000'
  text_light: '#f7f3ee'
  background: '#ffffff'
  code_bg: '#f0ede8'
  code_color: '#e6e6e6'
  quote_border: '#326891'
  quote_bg: '#f7f3ee'
  border_radius: 6px
