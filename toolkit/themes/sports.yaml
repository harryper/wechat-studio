name: 运动
description: '运动绿 #00A968 + 渐变色带，活力动感，适合体育/健身/户外内容'
colors:
  primary: '#2c2c2c'
  secondary: '#00A968'
  text: '#2c2c2c'
  text_light: '#f8f8f8'
  background: '#ffffff'
  code_bg: '#282c34'
  code_color: '#e6e6e6'
  quote_border: '#00A968'
  quote_bg: '#f8f8f8'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 22px;\n\
  \    font-weight: 700;\n    color: #ffffff;\n    text-align: center;\n    letter-spacing:\
  \ 0.12em;\n    line-height: 1.4;\n    background: linear-gradient(120deg, #00A968,\
  \ #008A56, #00A968);\n    border-radius: 50px;\n    padding: 12px 24px;\n    margin-top:\
  \ 24px;\n    margin-bottom: 12px;\n    box-shadow: 0 8px 20px rgba(0, 169, 104,\
  \ 0.3);\n  }\n  h2 {\n    font-size: 20px;\n    font-weight: 600;\n    color: #00A968;\n\
  \    border-left: 4px solid;\n    padding: 8px 16px;\n    margin-top: 32px;\n  \
  \  margin-bottom: 12px;\n    line-height: 1.4;\n  }\n  h3 {\n    font-size: 18px;\n\
  \    font-weight: 600;\n    color: #00A968;\n    border-left: 4px solid;\n    padding:\
  \ 8px 20px;\n    margin-top: 28px;\n    margin-bottom: 12px;\n    line-height: 1.4;\n\
  \  }\n  p {\n    font-size: 15px;\n    color: #2c2c2c;\n    line-height: 1.8;\n\
  \    margin-top: 0;\n    margin-bottom: 16px;\n    letter-spacing: 0.02em;\n   \
  \ text-align: left;\n  }\n  blockquote {\n    border-left: 5px solid;\n    background:\
  \ #f8f8f8;\n    padding: 16px 20px;\n    margin-top: 24px;\n    margin-bottom: 24px;\n\
  \    border-radius: 0 8px 8px 0;\n    font-size: 15px;\n    color: #3c3c3e;\n  \
  \  line-height: 1.8;\n  }\n\n  blockquote p {\n    margin: 8px 0;\n    color: #3c3c3e;\n\
  \  }\n  strong {\n    font-weight: 700;\n    color: #00A968;\n  }\n  em {\n    font-style:\
  \ italic;\n    color: #00A968;\n  }\n  a {\n    color: #00A968;\n    text-decoration:\
  \ none;\n  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n\
  \    font-size: 13px;\n    background: #282c34;\n    color: #e6e6e6;\n    padding:\
  \ 2px 6px;\n    border-radius: 4px;\n  }\n\n  pre {\n    background: #282c34;\n\
  \    color: #e6e6e6;\n    padding: 16px;\n    border-radius: 6px;\n    overflow-x:\
  \ auto;\n    margin: 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background:\
  \ none;\n    padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n\
  \    border-top: 1px solid #00A968;\n    margin: 28px auto;\n    width: 60%;\n \
  \ }\n  img {\n    max-width: 100%;\n    height: auto;\n    display: block;\n   \
  \ margin: 24px auto;\n    border-radius: 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#00A968'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#00A968'
