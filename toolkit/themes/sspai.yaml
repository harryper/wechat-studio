name: 少数派
description: '少数派红 #D71A1B 强调，衬线体标题，清爽白底，适合数码评测、效率工具分享'
colors:
  primary: '#333333'
  secondary: '#D71A1B'
  text: '#333333'
  text_light: '#fff8f8'
  background: '#ffffff'
  code_bg: '#fafafa'
  code_color: '#e6e6e6'
  quote_border: '#D71A1B'
  quote_bg: '#fff8f8'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 29px;\n\
  \    font-weight: 700;\n    color: #2d2d2d;\n    text-align: center;\n    letter-spacing:\
  \ -0.015em;\n    line-height: 1.32;\n    background: linear-gradient(180deg, rgba(215,26,27,0.05)\
  \ 0%, rgba(255,255,255,1) 100%);\n    border-radius: 8px;\n    padding: 11px 16px\
  \ 10px;\n    margin-top: 36px;\n    margin-bottom: 18px;\n  }\n  h2 {\n    font-size:\
  \ 21px;\n    font-weight: 700;\n    color: #2d2d2d;\n    border-left: 4px solid\
  \ #D71A1B;\n    padding: 8px 0 8px 14px;\n    margin-top: 34px;\n    margin-bottom:\
  \ 18px;\n    line-height: 1.45;\n  }\n  h3 {\n    font-size: 19px;\n    font-weight:\
  \ 700;\n    color: #444444;\n    border-left: 3px solid #D71A1B;\n    padding: 0\
  \ 0 6px 12px;\n    margin-top: 28px;\n    margin-bottom: 14px;\n    line-height:\
  \ 1.45;\n  }\n  p {\n    font-size: 15px;\n    color: #333333;\n    line-height:\
  \ 1.8;\n    margin-top: 0;\n    margin-bottom: 20px;\n    letter-spacing: 0.5px;\n\
  \    text-align: left;\n  }\n  blockquote {\n    border-left: 4px solid #D71A1B;\n\
  \    background: linear-gradient(180deg, #fff8f8 0%, #fffdfd 100%);\n    padding:\
  \ 16px 20px;\n    margin-top: 24px;\n    margin-bottom: 24px;\n    border-radius:\
  \ 10px;\n    font-size: 16px;\n    color: #5b5555;\n    line-height: 1.8;\n  }\n\
  \n  blockquote p {\n    margin: 8px 0;\n    color: #5b5555;\n  }\n  strong {\n \
  \   font-weight: 700;\n    color: #c51718;\n  }\n  em {\n    font-style: italic;\n\
  \    color: #666666;\n  }\n  a {\n    color: #D71A1B;\n    text-decoration: none;\n\
  \  }\n  code {\n    font-family: \"SF Mono\", Menlo, Consolas, monospace;\n    font-size:\
  \ 13px;\n    background: #fafafa;\n    color: #e6e6e6;\n    padding: 2px 6px;\n\
  \    border-radius: 4px;\n  }\n\n  pre {\n    background: #fafafa;\n    color: #e6e6e6;\n\
  \    padding: 16px;\n    border-radius: 6px;\n    overflow-x: auto;\n    margin:\
  \ 16px 0;\n    line-height: 1.6;\n  }\n\n  pre code {\n    background: none;\n \
  \   padding: 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n    border-top:\
