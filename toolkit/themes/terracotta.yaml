name: 赤陶
description: '赤陶橙 #C86442 强调，暖灰文字，白底纹理，适合知识分享、自媒体干货'
colors:
  primary: '#222222'
  secondary: '#C86442'
  text: '#222222'
  text_light: '#f7f7f7'
  background: '#ffffff'
  code_bg: '#3B3B3B'
  code_color: '#e6e6e6'
  quote_border: '#C86442'
  quote_bg: '#f7f7f7'
  border_radius: 6px
base_css: "  body {\n    font-family: -apple-system, \"PingFang SC\", \"Helvetica\
  \ Neue\", sans-serif;\n    font-size: 15px;\n    line-height: 1.75;\n    color:\
  \ #222222;\n    background: #ffffff;\n    max-width: 720px;\n    margin: 0 auto;\n\
  \    padding: 16px;\n    word-wrap: break-word;\n  }\n  h1 {\n    font-size: 22px;\n\
  \    font-weight: bold;\n    color: #ffffff;\n    text-align: center;\n    letter-spacing:\
  \ 0;\n    line-height: 1.2;\n    background: #C86442;\n    border-radius: 8px;\n\
  \    padding: 12px 24px;\n    margin-top: 24px;\n    margin-bottom: 12px;\n    box-shadow:\
  \ 0 2px 8px rgba(200,100,66,0.2);\n  }\n  h2 {\n    font-size: 20px;\n    font-weight:\
  \ bold;\n    color: #3F3F3F;\n    border-left: 4px solid #C86442;\n    padding:\
  \ 0 0 8px 12px;\n    margin-top: 32px;\n    margin-bottom: 12px;\n    line-height:\
  \ 1.2;\n    border-bottom: 1px dashed #C86442;\n  }\n  h3 {\n    font-size: 18px;\n\
  \    font-weight: bold;\n    color: #3F3F3F;\n    border-left: 3px solid #C86442;\n\
  \    padding: 0 0 6px 12px;\n    margin-top: 32px;\n    margin-bottom: 12px;\n \
  \   line-height: 1.2;\n  }\n  p {\n    font-size: 15px;\n    color: #222222;\n \
  \   line-height: 1.75;\n    margin-top: 0;\n    margin-bottom: 20px;\n    letter-spacing:\
  \ 0.5px;\n    text-align: left;\n  }\n  blockquote {\n    border-left: 4px solid\
  \ #C86442;\n    background: #f6f6f4;\n    padding: 16px 16px 16px 32px;\n    margin-top:\
  \ 24px;\n    margin-bottom: 32px;\n    border-radius: 6px;\n    font-size: 15px;\n\
  \    color: rgba(0,0,0,0.6);\n    line-height: 1.75;\n    font-style: italic;\n\
  \    box-shadow: 0 4px 6px rgba(0,0,0,0.05);\n  }\n\n  blockquote p {\n    margin:\
  \ 8px 0;\n    color: rgba(0,0,0,0.6);\n  }\n  strong {\n    font-weight: bold;\n\
  \    color: #C86442;\n  }\n  em {\n    font-style: italic;\n    color: #666666;\n\
  \  }\n  a {\n    color: #C86442;\n    text-decoration: none;\n  }\n  code {\n  \
  \  font-family: \"SF Mono\", Menlo, Consolas, monospace;\n    font-size: 13px;\n\
  \    background: #3B3B3B;\n    color: #e6e6e6;\n    padding: 2px 6px;\n    border-radius:\
  \ 4px;\n  }\n\n  pre {\n    background: #3B3B3B;\n    color: #e6e6e6;\n    padding:\
  \ 16px;\n    border-radius: 6px;\n    overflow-x: auto;\n    margin: 16px 0;\n \
  \   line-height: 1.6;\n  }\n\n  pre code {\n    background: none;\n    padding:\
  \ 0;\n    border-radius: 0;\n  }\n  hr {\n    border: none;\n    border-top: 1px\
  \ solid #C86442;\n    margin: 28px auto;\n    width: 60%;\n  }\n  img {\n    max-width:\
  \ 100%;\n    height: auto;\n    display: block;\n    margin: 24px auto;\n    border-radius:\
  \ 4px;\n  }"
darkmode:
  background: '#1c1c1e'
  text: '#e5e5e7'
  text_light: '#888888'
  primary: '#C86442'
  code_bg: '#2a2a2a'
  code_color: '#e6e6e6'
  quote_bg: '#262626'
  quote_border: '#C86442'
