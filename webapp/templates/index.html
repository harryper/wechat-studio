<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>微信公众号工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0f1115;
    --surface-1: #181b22;
    --surface-2: #1f232c;
    --surface-3: #262b35;
    --text-1: #e6e8ed;
    --text-2: #aab0bd;
    --text-3: #6c7280;
    --primary: #ff4d6d;
    --primary-hover: #ff6e8a;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --border: #2a2f3a;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    line-height: 1.6;
    min-height: 100vh;
  }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height: 100vh;
  }
  header {
    grid-area: header;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .emoji { font-size: 20px; }
  header .actions { display: flex; gap: 12px; align-items: center; }
  header a {
    color: var(--text-2);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: var(--radius);
    transition: all 0.15s;
  }
  header a:hover { background: var(--surface-3); color: var(--text-1); }
  aside {
    grid-area: sidebar;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  main {
    grid-area: main;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--primary); }
  .form-group { margin-bottom: 14px; }
  button {
    background: var(--surface-3);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: var(--border); }
  button.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    font-weight: 600;
  }
  button.primary:hover { background: var(--primary-hover); }
  button.full { width: 100%; padding: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .actions-row { display: flex; gap: 8px; margin-top: 8px; }
  .actions-row button { flex: 1; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .status.success { background: rgba(74, 222, 128, 0.12); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.4); }
  .status.error { background: rgba(248, 113, 113, 0.12); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
  .status.warning { background: rgba(251, 191, 36, 0.12); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.4); }
  .preview-frame {
    width: 100%;
    flex: 1;
    min-height: 500px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty-state {
    color: var(--text-3);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .topic-meta {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 6px;
    min-height: 16px;
  }
  .topic-meta strong { color: var(--text-2); font-weight: 500; }
  h2.section-label {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .history-section { margin-top: 24px; }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
  }
  .history-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-item:hover { background: var(--surface-3); }
  .history-item.active {
    border-color: var(--primary);
    background: rgba(255, 77, 109, 0.08);
  }
  .history-item .id-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .history-item .hid {
    font-size: 11px;
    color: var(--text-3);
    font-family: monospace;
  }
  .history-item .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .history-item .badge.real {
    background: rgba(74, 222, 128, 0.18);
    color: var(--success);
  }
  .history-item .badge.placeholder {
    background: rgba(251, 191, 36, 0.18);
    color: var(--warning);
  }
  .history-item .delete-btn {
    background: transparent;
    border: none;
    color: var(--text-3);
    font-size: 14px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.7;
    transition: all 0.15s;
  }
  .history-item .delete-btn:hover {
    color: var(--danger);
    background: rgba(248, 113, 113, 0.12);
    opacity: 1;
  }
  .history-item .title {
    font-size: 13px;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item .meta {
    font-size: 11px;
    color: var(--text-3);
  }
  .history-empty {
    color: var(--text-3);
    font-size: 12px;
    text-align: center;
    padding: 10px;
  }
</style>
</head>
<body>
  <div class="layout">
    <header>
      <h1><span class="emoji">📝</span>微信公众号工作台</h1>
      <div class="actions">
        <a href="/api/health" target="_blank">健康检查</a>
        <a href="/logout">退出</a>
      </div>
    </header>

    <aside>
      <h2 class="section-label">主题预览 / 推送</h2>

      <div class="form-group">
        <label for="topic_id">主题</label>
        <select id="topic_id">
          {% for t in topics %}
          <option value="{{ t.id }}" data-category="{{ t.category }}">{{ t.id }} — {{ t.title }}（{{ t.category }}）</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="theme">主题样式</label>
        <select id="theme">
          {% for t in themes %}
          <option value="{{ t }}" {% if t == 'terracotta' %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="actions-row">
        <button class="primary full" id="btn-preview">生成预览</button>
      </div>

      <div class="topic-meta" id="topic-meta">&nbsp;</div>

      <div class="actions-row" style="margin-top: 14px;">
        <button class="full" id="btn-publish" disabled>推送到微信</button>
      </div>

      <div class="status" id="status"></div>

      <div class="history-section">
        <h2 class="section-label">历史预览</h2>
        <div class="history-list" id="history-list">
          <div class="history-empty">暂无历史记录</div>
        </div>
      </div>
    </aside>

    <main>
      <div class="empty-state" id="empty-state">
        在左侧选择主题，点击「生成预览」开始<br>
        <small>写作约 30-180 秒（调用 LLM）+ 配图</small>
      </div>
      <iframe id="preview-frame" class="preview-frame" style="display:none;" sandbox="allow-same-origin"></iframe>
    </main>
  </div>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const topicSelect = $('topic_id');
    const themeInput = $('theme');
    const btnPreview = $('btn-preview');
    const btnPublish = $('btn-publish');
    const statusEl = $('status');
    const metaEl = $('topic-meta');
    const frame = $('preview-frame');
    const empty = $('empty-state');
    const historyList = $('history-list');

    // currentPreview: {history_id, topic, theme, html_url, image_mode}
    let currentPreview = null;

    function showStatus(kind, msg) {
      statusEl.className = 'status show ' + kind;
      statusEl.textContent = msg;
    }

    function setPreview(htmlUrl, restoreScroll) {
      frame.style.display = 'block';
      empty.style.display = 'none';
      frame.src = htmlUrl;          // was: frame.srcdoc = html
      if (restoreScroll !== undefined) {
        frame.onload = () => {
          writeIframeScroll(restoreScroll);
          frame.onload = null;
        };
        setTimeout(() => {
          if (frame.onload) {
            writeIframeScroll(restoreScroll);
            frame.onload = null;
          }
        }, 50);
      } else {
        frame.onload = null;
      }
    }

    function readIframeScroll() {
      const doc = frame.contentDocument;
      if (!doc) return 0;
      return doc.documentElement.scrollTop || doc.body.scrollTop || 0;
    }

    function writeIframeScroll(y) {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.documentElement.scrollTop = y;
      doc.body.scrollTop = y;
    }

    function clearPreview() {
      frame.style.display = 'none';
      frame.srcdoc = '';
      empty.style.display = 'flex';
    }

    function setMeta(p) {
      metaEl.innerHTML =
        '<strong>' + p.topic.id + '</strong> · ' +
        p.topic.title + ' · <strong>' + p.topic.category +
        '</strong> · theme=' + p.theme;
    }

    function imageModeBadge(mode) {
      if (mode === 'real') {
        return '<span class="badge real">AI</span>';
      }
      return '<span class="badge placeholder">占位</span>';
    }

    function renderHistory(entries) {
      historyList.innerHTML = '';
      if (!entries.length) {
        historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        return;
      }
      for (const e of entries) {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.dataset.id = String(e.id);
        if (currentPreview && currentPreview.history_id === e.id) {
          div.classList.add('active');
        }
        div.innerHTML =
          '<div class="id-row">' +
            '<span class="hid">#' + e.id + '</span>' +
            imageModeBadge(e.image_mode) +
            '<button class="delete-btn" data-id="' + e.id + '" title="删除历史 #' + e.id + '">×</button>' +
          '</div>' +
          '<div class="title">' + (e.title || e.topic_id) + '</div>' +
          '<div class="meta">' +
            (e.topic_id || '') + ' · ' + (e.theme || '') + ' · ' +
            (e.created_at || '') +
          '</div>';
        div.querySelector('.delete-btn').addEventListener('click', (ev) => {
          ev.stopPropagation();
          deleteHistory(e.id);
        });
        div.addEventListener('click', () => loadHistoryEntry(e.id));
        historyList.appendChild(div);
      }
    }

    async function refreshHistory() {
      try {
        const resp = await fetch('/api/history');
        const data = await resp.json();
        if (resp.ok && data.ok) {
          renderHistory(data.entries);
        }
      } catch (e) {
        // history is best-effort; ignore network errors
      }
    }

    async function loadHistoryEntry(id) {
      try {
        const resp = await fetch('/api/history/' + id);
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', data.error || '加载历史失败');
          return;
        }
        const e = data.entry;
        const prevId = currentPreview ? currentPreview.history_id : null;
        currentPreview = {
          history_id: e.id,
          topic: {id: e.topic_id, title: e.title, category: e.category},
          theme: e.theme,
          html_url: data.html_url,
          image_mode: e.image_mode,
        };
        const restore = prevId === e.id ? readIframeScroll() : 0;
        setPreview(data.html_url, restore);
        setMeta(currentPreview);
        const modeText = e.image_mode === 'real' ? 'AI 生图' : '占位图';
        showStatus('info', '📜 已回看历史 #' + e.id + ' · ' + modeText);
        btnPublish.disabled = false;
        // highlight active item
        for (const it of historyList.querySelectorAll('.history-item')) {
          it.classList.toggle('active', it.dataset.id === String(e.id));
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      }
    }

    async function deleteHistory(id) {
      if (!confirm('确认删除历史 #' + id + '？')) return;
      try {
        const resp = await fetch('/api/history/' + id, { method: 'DELETE' });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', '删除失败：' + (data.error || resp.status));
          return;
        }
        if (currentPreview && currentPreview.history_id === id) {
          clearPreview();
          currentPreview = null;
          btnPublish.disabled = true;
          metaEl.innerHTML = '&nbsp;';
        }
        await refreshHistory();
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      }
    }

    async function doPreview() {
      const topicId = (topicSelect.value || '').trim();
      const theme = themeInput.value;
      if (!topicId) {
        showStatus('error', '请选择主题');
        return;
      }
      btnPreview.disabled = true;
      btnPublish.disabled = true;
      showStatus('info', '✍️  正在写作并配图（LLM 30-180 秒，图片另加 10-30 秒）…');
      try {
        const resp = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic_id: topicId, theme: theme }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', data.error || '预览失败');
          clearPreview();
          metaEl.innerHTML = '&nbsp;';
          currentPreview = null;
          btnPublish.disabled = true;
          return;
        }
        currentPreview = {
          history_id: data.history_id,
          topic: data.topic,
          theme: data.theme,
          html_url: data.html_url,
          image_mode: data.image_mode,
        };
        setPreview(data.html_url, undefined);  // reset scroll on new preview
        setMeta(currentPreview);
        const modeText = data.image_mode === 'real' ? 'AI 生图' : '占位图（请配置图片 API key 以使用 AI 生图）';
        const kind = data.image_mode === 'real' ? 'success' : 'warning';
        showStatus(kind, '✅ 预览已生成 · ' + modeText);
        btnPublish.disabled = false;
        await refreshHistory();
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      } finally {
        btnPreview.disabled = false;
      }
    }

    async function doPublish() {
      if (!currentPreview) {
        showStatus('error', '请先生成预览或从历史中选择');
        return;
      }
      if (!confirm('确认推送到微信草稿箱？\n历史 # ' + currentPreview.history_id +
                  ' · ' + currentPreview.topic.id + ' · ' + currentPreview.topic.title)) {
        return;
      }
      btnPublish.disabled = true;
      btnPreview.disabled = true;
      showStatus('info', '🚀 正在推送…');
      try {
        const resp = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history_id: currentPreview.history_id }),
        });
        const data = await resp.json();
        if (data.ok) {
          showStatus('success', '✅ 推送成功\n' + (data.stdout || '').trim());
        } else {
          let msg = '❌ 推送失败（returncode=' + data.returncode + '）';
          if (data.stderr && data.stderr.trim()) {
            msg += '\n' + data.stderr.trim();
          }
          if (data.stdout && data.stdout.trim()) {
            msg += '\n--- stdout ---\n' + data.stdout.trim();
          }
          showStatus('error', msg);
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      } finally {
        btnPublish.disabled = false;
        btnPreview.disabled = false;
      }
    }

    btnPreview.addEventListener('click', doPreview);
    btnPublish.addEventListener('click', doPublish);
    refreshHistory();
  })();
  </script>
</body>
</html>
