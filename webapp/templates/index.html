<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>微信公众号工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0f1115;
    --surface-1: #181b22;
    --surface-2: #1f232c;
    --surface-3: #262b35;
    --text-1: #e6e8ed;
    --text-2: #aab0bd;
    --text-3: #6c7280;
    --primary: #ff4d6d;
    --primary-hover: #ff6e8a;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --border: #2a2f3a;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    line-height: 1.6;
    min-height: 100vh;
  }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height: 100vh;
  }
  header {
    grid-area: header;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .emoji { font-size: 20px; }
  header .actions { display: flex; gap: 12px; align-items: center; }
  header a {
    color: var(--text-2);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: var(--radius);
    transition: all 0.15s;
  }
  header a:hover { background: var(--surface-3); color: var(--text-1); }
  aside {
    grid-area: sidebar;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  main {
    grid-area: main;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--primary); }
  .form-group { margin-bottom: 14px; }
  button {
    background: var(--surface-3);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: var(--border); }
  button.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    font-weight: 600;
  }
  button.primary:hover { background: var(--primary-hover); }
  button.full { width: 100%; padding: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .actions-row { display: flex; gap: 8px; margin-top: 8px; }
  .actions-row button { flex: 1; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .status.success { background: rgba(74, 222, 128, 0.12); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.4); }
  .status.error { background: rgba(248, 113, 113, 0.12); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
  .preview-frame {
    width: 100%;
    flex: 1;
    min-height: 500px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty-state {
    color: var(--text-3);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .topic-meta {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 6px;
    min-height: 16px;
  }
  .topic-meta strong { color: var(--text-2); font-weight: 500; }
  h2.section-label {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="layout">
    <header>
      <h1><span class="emoji">📝</span>微信公众号工作台</h1>
      <div class="actions">
        <a href="/api/health" target="_blank">健康检查</a>
        <a href="/logout">退出</a>
      </div>
    </header>

    <aside>
      <h2 class="section-label">主题预览 / 推送</h2>

      <div class="form-group">
        <label for="topic_id">主题</label>
        <select id="topic_id">
          {% for t in topics %}
          <option value="{{ t.id }}" data-category="{{ t.category }}">{{ t.id }} — {{ t.title }}（{{ t.category }}）</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="theme">主题样式</label>
        <select id="theme">
          {% for t in themes %}
          <option value="{{ t }}" {% if t == 'terracotta' %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="actions-row">
        <button class="primary full" id="btn-preview">生成预览</button>
      </div>

      <div class="topic-meta" id="topic-meta">&nbsp;</div>

      <div class="actions-row" style="margin-top: 14px;">
        <button class="full" id="btn-publish" disabled>推送到微信</button>
      </div>

      <div class="status" id="status"></div>
    </aside>

    <main>
      <div class="empty-state" id="empty-state">
        在左侧选择主题，点击「生成预览」开始<br>
        <small>写作约 30-90 秒，配图约 30-60 秒</small>
      </div>
      <iframe id="preview-frame" class="preview-frame" style="display:none;" sandbox="allow-same-origin"></iframe>
    </main>
  </div>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const topicSelect = $('topic_id');
    const themeInput = $('theme');
    const btnPreview = $('btn-preview');
    const btnPublish = $('btn-publish');
    const statusEl = $('status');
    const metaEl = $('topic-meta');
    const frame = $('preview-frame');
    const empty = $('empty-state');

    let currentSession = null;  // {token, topic, theme, html}
    let renderInFlight = false;

    function showStatus(kind, msg) {
      statusEl.className = 'status show ' + kind;
      statusEl.textContent = msg;
    }

    function hideStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function setPreview(html) {
      frame.style.display = 'block';
      empty.style.display = 'none';
      frame.srcdoc = html;
    }

    function clearPreview() {
      frame.style.display = 'none';
      frame.srcdoc = '';
      empty.style.display = 'flex';
    }

    function setMeta(topic, theme) {
      metaEl.innerHTML =
        '<strong>' + topic.id + '</strong> · ' +
        topic.title + ' · <strong>' +
        topic.category + '</strong> · theme=' + theme;
    }

    async function doPreview() {
      const topicId = (topicSelect.value || '').trim();
      const theme = themeInput.value;
      if (!topicId) {
        showStatus('error', '请选择主题');
        return;
      }
      btnPreview.disabled = true;
      btnPublish.disabled = true;
      clearPreview();
      metaEl.innerHTML = '&nbsp;';
      currentSession = null;

      // 第 1 段：调用 LLM 写文章（30-90s）
      showStatus('info', '✍️  正在写作（调用 LLM，可能需要 30-90 秒）…');
      let writeData;
      try {
        const resp = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic_id: topicId, theme: theme }),
        });
        writeData = await resp.json();
        if (!resp.ok || !writeData.ok) {
          showStatus('error', '写作失败：' + (writeData.error || '未知错误'));
          return;
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
        return;
      }

      currentSession = {
        token: writeData.session_token,
        topic: writeData.topic,
        theme: theme,
        html: null,
      };
      setMeta(writeData.topic, theme);
      showStatus('success',
        '✅ 写作完成（' + writeData.article_chars + ' 字）\n' +
        '🎨 正在生成配图并渲染预览…');

      // 第 2 段：生成图片 + 渲染预览（30-60s）
      renderInFlight = true;
      try {
        const resp = await fetch('/api/preview/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_token: writeData.session_token }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', '配图/渲染失败：' + (data.error || '未知错误'));
          currentSession = null;
          return;
        }
        currentSession.html = data.html;
        setPreview(data.html);
        showStatus('success',
          '✅ 预览已生成（' + data.image_count + ' 张配图）。可点击「推送到微信」提交。');
        btnPublish.disabled = false;
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
        currentSession = null;
      } finally {
        renderInFlight = false;
      }
    }

    async function doPublish() {
      if (!currentSession || !currentSession.html) {
        showStatus('error', '请先生成预览');
        return;
      }
      const session = currentSession;
      if (!confirm('确认推送到微信草稿箱？\n主题：' + session.topic.id + ' · ' + session.topic.title)) {
        return;
      }
      btnPublish.disabled = true;
      btnPreview.disabled = true;
      showStatus('info', '🚀 正在推送…');
      try {
        const resp = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_token: session.token }),
        });
        const data = await resp.json();
        if (data.ok) {
          showStatus('success', '✅ 推送成功\n' + (data.stdout || '').trim());
        } else {
          let msg = '❌ 推送失败（returncode=' + data.returncode + '）';
          if (data.stderr && data.stderr.trim()) {
            msg += '\n' + data.stderr.trim();
          }
          if (data.stdout && data.stdout.trim()) {
            msg += '\n--- stdout ---\n' + data.stdout.trim();
          }
          showStatus('error', msg);
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      } finally {
        btnPublish.disabled = false;
        btnPreview.disabled = false;
      }
    }

    btnPreview.addEventListener('click', doPreview);
    btnPublish.addEventListener('click', doPublish);
  })();
  </script>
</body>
</html>
