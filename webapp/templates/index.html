<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>微信公众号工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0f1115;
    --surface-1: #181b22;
    --surface-2: #1f232c;
    --surface-3: #262b35;
    --text-1: #e6e8ed;
    --text-2: #aab0bd;
    --text-3: #6c7280;
    --primary: #ff4d6d;
    --primary-hover: #ff6e8a;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
    --border: #2a2f3a;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text-1);
    line-height: 1.6;
    min-height: 100vh;
  }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height: 100vh;
  }
  header {
    grid-area: header;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .emoji { font-size: 20px; }
  header .actions { display: flex; gap: 12px; align-items: center; }
  header a {
    color: var(--text-2);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: var(--radius);
    transition: all 0.15s;
  }
  header a:hover { background: var(--surface-3); color: var(--text-1); }
  aside {
    grid-area: sidebar;
    background: var(--surface-1);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  main {
    grid-area: main;
    overflow-y: auto;
    padding: 20px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.035), transparent 42%),
      var(--bg);
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--primary); }
  .form-group { margin-bottom: 14px; }
  .topic-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .topic-category-filter { grid-column: 1 / -1; }
  .topic-center {
    margin-top: 8px;
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
  }
  .topic-card {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .topic-card:last-child { border-bottom: 0; }
  .topic-card:hover { background: var(--surface-3); }
  .topic-card.selected { background: rgba(255, 77, 109, 0.13); box-shadow: inset 3px 0 var(--primary); }
  .topic-card-title { font-size: 13px; color: var(--text-1); line-height: 1.4; }
  .topic-card-meta { margin-top: 3px; font-size: 11px; color: var(--text-3); }
  .topic-state { margin-left: 5px; color: var(--warning); }
  .topic-center-empty { padding: 16px 10px; text-align: center; font-size: 12px; color: var(--text-3); }
  .custom-topic-form {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
  }
  .custom-topic-form.show { display: block; }
  .custom-topic-form input, .custom-topic-form textarea { margin-bottom: 8px; }
  .custom-topic-form textarea { min-height: 70px; resize: vertical; }
  button {
    background: var(--surface-3);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { background: var(--border); }
  button.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    font-weight: 600;
  }
  button.primary:hover { background: var(--primary-hover); }
  button.full { width: 100%; padding: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .actions-row { display: flex; gap: 8px; margin-top: 8px; }
  .actions-row button { flex: 1; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .status.success { background: rgba(74, 222, 128, 0.12); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.4); }
  .status.error { background: rgba(248, 113, 113, 0.12); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
  .status.warning { background: rgba(251, 191, 36, 0.12); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.4); }
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .modal.success .modal-header { color: var(--success); background: rgba(74, 222, 128, 0.08); }
  .modal.error .modal-header   { color: var(--danger);  background: rgba(248, 113, 113, 0.08); }
  .modal.warning .modal-header { color: var(--warning); background: rgba(251, 191, 36, 0.08); }
  .modal-body {
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .modal-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }
  .modal-footer button {
    padding: 6px 14px;
    background: var(--surface-3);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .modal-footer button:hover { background: var(--primary); border-color: var(--primary); }
  .preview-frame {
    width: min(760px, 100%);
    flex: 1;
    min-height: 500px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 18px 55px rgba(0, 0, 0, 0.34);
  }
  .work-toolbar {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    width: min(1080px, 100%);
    justify-content: center;
  }
  .work-toolbar.show { display: flex; }
  .work-toolbar select { width: auto; min-width: 120px; }
  .editor {
    display: none;
    flex: 1;
    width: min(1080px, 100%);
    min-height: 620px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.65;
  }
  .editor.show { display: block; }
  .empty-state {
    color: var(--text-3);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(760px, 100%);
  }
  .topic-meta {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 6px;
    min-height: 16px;
  }
  .topic-meta strong { color: var(--text-2); font-weight: 500; }
  h2.section-label {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .pipeline-note {
    margin: -2px 0 16px;
    color: var(--text-3);
    font-size: 11px;
    line-height: 1.55;
  }
  .history-section { margin-top: 24px; }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
  }
  .history-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .history-item:hover { background: var(--surface-3); }
  .history-item.active {
    border-color: var(--primary);
    background: rgba(255, 77, 109, 0.08);
  }
  .history-item .id-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .history-item .hid {
    font-size: 11px;
    color: var(--text-3);
    font-family: monospace;
  }
  .history-item .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .history-item .badge.real {
    background: rgba(74, 222, 128, 0.18);
    color: var(--success);
  }
  .history-item .badge.placeholder {
    background: rgba(251, 191, 36, 0.18);
    color: var(--warning);
  }
  .history-item .delete-btn {
    background: transparent;
    border: none;
    color: var(--text-3);
    font-size: 14px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.7;
    transition: all 0.15s;
  }
  .history-item .delete-btn:hover {
    color: var(--danger);
    background: rgba(248, 113, 113, 0.12);
    opacity: 1;
  }
  .history-item .title {
    font-size: 13px;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-item .meta {
    font-size: 11px;
    color: var(--text-3);
  }
  .history-empty {
    color: var(--text-3);
    font-size: 12px;
    text-align: center;
    padding: 10px;
  }
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(640px, 1fr);
      grid-template-areas:
        "header"
        "sidebar"
        "main";
      height: auto;
      min-height: 100vh;
    }
    aside {
      border-right: 0;
      border-bottom: 1px solid var(--border);
      overflow: visible;
    }
    main { min-height: 680px; padding: 16px; }
    .preview-frame {
      width: 100%;
      border-radius: 8px;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
  <div class="layout">
    <header>
      <h1><span class="emoji">📝</span>微信公众号工作台</h1>
      <div class="actions">
        <a href="/api/health" target="_blank">健康检查</a>
        <a href="/logout">退出</a>
      </div>
    </header>

    <aside>
      <h2 class="section-label">知识库长文</h2>
      <p class="pipeline-note">选题 → 2500–4000 字框架写作 → 封面 + 4 张内文图 → 预览。<br>生成在后台执行，可安全离开页面后再回看历史。</p>

      <div class="form-group">
        <label for="topic-search">选题中心</label>
        <input id="topic-search" type="search" placeholder="搜索标题或主题 ID">
        <div class="topic-filters">
          <select id="topic-status" aria-label="主题状态">
            <option value="available">未创作</option>
            <option value="drafted">已创作</option>
            <option value="pushed">已推送</option>
            <option value="published">已发布</option>
            <option value="all">全部状态</option>
          </select>
          <select id="topic-source" aria-label="主题来源">
            <option value="all">全部来源</option>
            <option value="corpus">知识库</option>
            <option value="custom">自定义</option>
            <option value="hotspot">热点</option>
            <option value="import">导入</option>
          </select>
          <select id="topic-category" class="topic-category-filter" aria-label="主题分类">
            <option value="all">全部分类</option>
          </select>
        </div>
        <input id="topic_id" type="hidden">
        <div class="topic-center" id="topic-center">
          <div class="topic-center-empty">正在加载选题…</div>
        </div>
        <div class="actions-row">
          <button class="full" id="btn-new-topic" type="button">＋ 自定义主题</button>
        </div>
        <div class="custom-topic-form" id="custom-topic-form">
          <input id="custom-topic-title" placeholder="主题标题（必填）" maxlength="120">
          <input id="custom-topic-category" placeholder="分类，例如：行业观察" maxlength="60">
          <textarea id="custom-topic-points" placeholder="关键要点，每行一条"></textarea>
          <input id="custom-topic-origin" placeholder="背景或素材来源（可选）" maxlength="300">
          <div class="actions-row">
            <button id="btn-save-topic" class="primary" type="button">保存并选择</button>
            <button id="btn-cancel-topic" type="button">取消</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="client">客户风格（可选）</label>
        <select id="client">
          <option value="">通用知识库</option>
          {% for client in clients %}
          <option value="{{ client }}">{{ client }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="theme">主题样式</label>
        <select id="theme">
          {% for t in themes %}
          <option value="{{ t }}" {% if t == 'terracotta' %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="actions-row">
        <button class="primary full" id="btn-preview">生成预览</button>
      </div>

      <div class="topic-meta" id="topic-meta">&nbsp;</div>

      <div class="actions-row" style="margin-top: 14px;">
        <button class="full" id="btn-publish" disabled>确认并推送到微信草稿</button>
      </div>

      <div class="actions-row">
        <button id="btn-preflight" disabled>发布前检查</button>
        <button id="btn-edit" disabled>编辑 Markdown</button>
      </div>

      <div class="status" id="status"></div>

      <div class="history-section">
        <h2 class="section-label">历史预览</h2>
        <div class="history-list" id="history-list">
          <div class="history-empty">暂无历史记录</div>
        </div>
      </div>
    </aside>

    <main>
      <div class="work-toolbar" id="work-toolbar">
        <button id="btn-save-edit" style="display:none">保存并重新预览</button>
        <button id="btn-cancel-edit" style="display:none">取消编辑</button>
        <button id="btn-regen-article">只重写文章</button>
        <button id="btn-regen-images">重生全部图片</button>
        <select id="image-role">
          <option value="cover">封面</option>
          <option value="inline-1">内文图 1</option>
          <option value="inline-2">内文图 2</option>
          <option value="inline-3">内文图 3</option>
          <option value="inline-4">内文图 4</option>
        </select>
        <button id="btn-regen-image">重生选中图</button>
        <button id="btn-apply-theme">应用当前主题</button>
      </div>
      <div class="empty-state" id="empty-state">
        在左侧选择主题，点击「生成预览」开始<br>
        <small>写作约 30-180 秒（调用 LLM）+ 配图</small>
      </div>
      <textarea id="markdown-editor" class="editor" spellcheck="false"></textarea>
      <iframe id="preview-frame" class="preview-frame" style="display:none;" sandbox="allow-same-origin"></iframe>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header" id="modal-header"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer"><button id="modal-ok" type="button">确定</button></div>
    </div>
  </div>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const topicSelect = $('topic_id');
    const topicSearch = $('topic-search');
    const topicStatus = $('topic-status');
    const topicSource = $('topic-source');
    const topicCategory = $('topic-category');
    const topicCenter = $('topic-center');
    const clientSelect = $('client');
    const themeInput = $('theme');
    const btnPreview = $('btn-preview');
    const btnPublish = $('btn-publish');
    const btnPreflight = $('btn-preflight');
    const btnEdit = $('btn-edit');
    const statusEl = $('status');
    const metaEl = $('topic-meta');
    const frame = $('preview-frame');
    const empty = $('empty-state');
    const historyList = $('history-list');
    const toolbar = $('work-toolbar');
    const editor = $('markdown-editor');

    // currentPreview: {history_id, topic, theme, html_url, image_mode}
    let currentPreview = null;
    let selectedTopic = null;
    let topicSearchTimer = null;

    const escapeHtml = (value) => String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

    const topicStateNames = {
      available: '未创作', drafted: '已创作', pushed: '已推送',
      published: '已发布', archived: '已归档', generating: '生成中',
      draft: '草稿', review: '待检查', ready: '可发布', failed: '失败'
    };

    function renderTopics(items) {
      topicCenter.innerHTML = '';
      if (!items.length) {
        topicCenter.innerHTML = '<div class="topic-center-empty">没有符合条件的主题，可以新建自定义主题</div>';
        topicSelect.value = '';
        selectedTopic = null;
        return;
      }
      for (const topic of items) {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.dataset.id = topic.id;
        if (topicSelect.value === topic.id) card.classList.add('selected');
        card.innerHTML =
          '<div class="topic-card-title">' + escapeHtml(topic.title) + '</div>' +
          '<div class="topic-card-meta">' + escapeHtml(topic.id) + ' · ' +
          escapeHtml(topic.category || '未分类') + ' · ' + escapeHtml(topic.source) +
          '<span class="topic-state">' + escapeHtml(topicStateNames[topic.status] || topic.status) + '</span></div>';
        card.addEventListener('click', () => {
          selectedTopic = topic;
          topicSelect.value = topic.id;
          for (const item of topicCenter.querySelectorAll('.topic-card')) item.classList.remove('selected');
          card.classList.add('selected');
          metaEl.textContent = topic.id + ' · ' + topic.title + ' · ' + (topic.category || '未分类');
        });
        topicCenter.appendChild(card);
      }
      if (!topicSelect.value || !items.some(item => item.id === topicSelect.value)) {
        topicCenter.querySelector('.topic-card').click();
      }
    }

    function updateCategoryOptions(items) {
      const current = topicCategory.value;
      const categories = [...new Set(items.map(item => item.category).filter(Boolean))].sort();
      topicCategory.innerHTML = '<option value="all">全部分类</option>' +
        categories.map(value => '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>').join('');
      if (categories.includes(current)) topicCategory.value = current;
    }

    async function loadTopics() {
      topicCenter.innerHTML = '<div class="topic-center-empty">正在加载选题…</div>';
      const params = new URLSearchParams({
        q: topicSearch.value.trim(),
        status: topicStatus.value,
        source: topicSource.value,
        category: topicCategory.value,
      });
      try {
        const resp = await fetch('/api/topics?' + params.toString());
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '选题加载失败');
        updateCategoryOptions(data.topics);
        renderTopics(data.topics);
      } catch (e) {
        topicCenter.innerHTML = '<div class="topic-center-empty">' + escapeHtml(e.message || e) + '</div>';
      }
    }

    async function saveCustomTopic() {
      const title = $('custom-topic-title').value.trim();
      if (!title) return showStatus('error', '请输入自定义主题标题');
      $('btn-save-topic').disabled = true;
      try {
        const resp = await fetch('/api/topics', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            title,
            category: $('custom-topic-category').value.trim() || 'custom',
            origin: $('custom-topic-origin').value.trim(),
            key_points: $('custom-topic-points').value.split('\n').map(x => x.trim()).filter(Boolean),
            client: clientSelect.value,
          }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '保存主题失败');
        topicStatus.value = 'available';
        topicSource.value = 'custom';
        topicCategory.value = 'all';
        topicSearch.value = title;
        await loadTopics();
        $('custom-topic-form').classList.remove('show');
        showStatus('success', '自定义主题已保存并选中。');
      } catch (e) {
        showStatus('error', e.message || e);
      } finally {
        $('btn-save-topic').disabled = false;
      }
    }

    function showStatus(kind, msg) {
      // success / error / warning → modal that the user must dismiss.
      // info → inline sidebar status (transient in-progress indicator).
      if (kind === 'info') {
        statusEl.className = 'status show ' + kind;
        statusEl.textContent = msg;
        return;
      }
      const backdrop = $('modal-backdrop');
      const modal = $('modal');
      const header = $('modal-header');
      const body = $('modal-body');
      modal.className = 'modal ' + kind;
      header.textContent = ({
        success: '✅ 操作成功',
        error:   '❌ 推送失败',
        warning: '⚠️ 注意',
      })[kind] || kind;
      body.textContent = msg;
      backdrop.classList.add('show');
      const close = () => backdrop.classList.remove('show');
      $('modal-ok').onclick = close;
      backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
      document.onkeydown = (e) => { if (e.key === 'Escape') close(); };
    }

    function setPreview(htmlUrl, restoreScroll) {
      editor.classList.remove('show');
      $('btn-save-edit').style.display = 'none';
      $('btn-cancel-edit').style.display = 'none';
      frame.style.display = 'block';
      empty.style.display = 'none';
      frame.src = htmlUrl + (htmlUrl.includes('?') ? '&' : '?') + 'v=' + Date.now();
      if (restoreScroll !== undefined) {
        frame.onload = () => {
          writeIframeScroll(restoreScroll);
          frame.onload = null;
        };
        setTimeout(() => {
          if (frame.onload) {
            writeIframeScroll(restoreScroll);
            frame.onload = null;
          }
        }, 50);
      } else {
        frame.onload = null;
      }
    }

    function readIframeScroll() {
      const doc = frame.contentDocument;
      if (!doc) return 0;
      return doc.documentElement.scrollTop || doc.body.scrollTop || 0;
    }

    function writeIframeScroll(y) {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.documentElement.scrollTop = y;
      doc.body.scrollTop = y;
    }

    function clearPreview() {
      frame.style.display = 'none';
      frame.srcdoc = '';
      editor.classList.remove('show');
      toolbar.classList.remove('show');
      empty.style.display = 'flex';
    }

    function setMeta(p) {
      metaEl.innerHTML =
        '<strong>' + escapeHtml(p.topic.id) + '</strong> · ' +
        escapeHtml(p.topic.title) + ' · <strong>' + escapeHtml(p.topic.category) +
        '</strong> · theme=' + escapeHtml(p.theme);
    }

    function imageModeBadge(mode) {
      if (mode === 'real') {
        return '<span class="badge real">AI</span>';
      }
      if (mode === 'mixed') {
        return '<span class="badge placeholder">混合</span>';
      }
      return '<span class="badge placeholder">占位</span>';
    }

    function setActions(enabled) {
      btnPublish.disabled = !enabled;
      btnPreflight.disabled = !enabled;
      btnEdit.disabled = !enabled;
      toolbar.classList.toggle('show', enabled);
    }

    function applyResult(result) {
      currentPreview = result;
      setPreview(result.html_url, undefined);
      setMeta(currentPreview);
      themeInput.value = result.theme;
      setActions(true);
    }

    function imageModeText(mode) {
      if (mode === 'real') return '5 张 AI 图';
      if (mode === 'mixed') return 'AI 图 + 占位图';
      return '全部占位图';
    }

    function renderHistory(entries) {
      historyList.innerHTML = '';
      if (!entries.length) {
        historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        return;
      }
      for (const e of entries) {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.dataset.id = String(e.id);
        if (currentPreview && currentPreview.history_id === e.id) {
          div.classList.add('active');
        }
        div.innerHTML =
          '<div class="id-row">' +
            '<span class="hid">#' + e.id + '</span>' +
            imageModeBadge(e.image_mode) +
            '<button class="delete-btn" data-id="' + e.id + '" title="删除历史 #' + e.id + '">×</button>' +
          '</div>' +
          '<div class="title">' + escapeHtml(e.title || e.topic_id) + '</div>' +
          '<div class="meta">' +
            escapeHtml(e.topic_id || '') + ' · ' + escapeHtml(e.theme || '') + ' · ' +
            escapeHtml(topicStateNames[e.status] || e.status || '草稿') + ' · ' +
            escapeHtml(e.updated_at || e.created_at || '') +
          '</div>';
        div.querySelector('.delete-btn').addEventListener('click', (ev) => {
          ev.stopPropagation();
          deleteHistory(e.id);
        });
        div.addEventListener('click', () => loadHistoryEntry(e.id));
        historyList.appendChild(div);
      }
    }

    async function refreshHistory() {
      try {
        const resp = await fetch('/api/history');
        const data = await resp.json();
        if (resp.ok && data.ok) {
          renderHistory(data.entries);
        }
      } catch (e) {
        // history is best-effort; ignore network errors
      }
    }

    async function loadHistoryEntry(id) {
      try {
        const resp = await fetch('/api/history/' + id);
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', data.error || '加载历史失败');
          return;
        }
        const e = data.entry;
        const prevId = currentPreview ? currentPreview.history_id : null;
        currentPreview = {
          history_id: e.id,
          topic: {id: e.topic_id, title: e.title, category: e.category},
          theme: e.theme,
          html_url: data.html_url,
          image_mode: e.image_mode,
          assessment: e.assessment || {},
        };
        const restore = prevId === e.id ? readIframeScroll() : 0;
        setPreview(data.html_url, restore);
        setMeta(currentPreview);
        if (e.client !== undefined) clientSelect.value = e.client || '';
        const modeText = imageModeText(e.image_mode);
        showStatus('info', '📜 已回看历史 #' + e.id + ' · ' + modeText);
        setActions(true);
        // highlight active item
        for (const it of historyList.querySelectorAll('.history-item')) {
          it.classList.toggle('active', it.dataset.id === String(e.id));
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      }
    }

    async function deleteHistory(id) {
      if (!confirm('确认删除历史 #' + id + '？')) return;
      try {
        const resp = await fetch('/api/history/' + id, { method: 'DELETE' });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          showStatus('error', '删除失败：' + (data.error || resp.status));
          return;
        }
        if (currentPreview && currentPreview.history_id === id) {
          clearPreview();
          currentPreview = null;
          setActions(false);
          metaEl.innerHTML = '&nbsp;';
        }
        await refreshHistory();
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const phaseNames = {
      queued: '排队中', starting: '准备中', writing: '写作中',
      images: '生成图片', render: '生成预览', quality: '质量检查', completed: '已完成'
    };

    async function pollJob(jobId) {
      localStorage.setItem('wechat-studio-active-job', jobId);
      btnPreview.disabled = true;
      setActions(false);
      while (true) {
        const resp = await fetch('/api/jobs/' + jobId);
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '查询任务失败');
        const job = data.job;
        showStatus('info', '⏳ ' + (phaseNames[job.phase] || job.phase) + ' · ' + job.progress + '%\n任务 ' + job.id.slice(0, 8));
        if (job.status === 'completed') {
          localStorage.removeItem('wechat-studio-active-job');
          applyResult(job.result);
          const kind = job.result.image_mode === 'real' ? 'success' : 'warning';
          showStatus(kind, '预览已生成 · ' + imageModeText(job.result.image_mode));
          await refreshHistory();
          await loadTopics();
          btnPreview.disabled = false;
          return;
        }
        if (job.status === 'failed') {
          localStorage.removeItem('wechat-studio-active-job');
          btnPreview.disabled = false;
          throw new Error(job.error || '生成任务失败');
        }
        await sleep(1500);
      }
    }

    async function submitJob(url, body) {
      const resp = await fetch(url, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body || {}),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || '提交任务失败');
      await pollJob(data.job_id);
    }

    async function doPreview() {
      const topicId = (topicSelect.value || '').trim();
      if (!topicId) return showStatus('error', '请选择主题');
      try {
        await submitJob('/api/jobs', {
          topic_id: topicId,
          theme: themeInput.value,
          client: clientSelect.value,
        });
      } catch (e) {
        showStatus('error', '生成失败：' + (e.message || e));
        btnPreview.disabled = false;
      }
    }

    async function regenerate(stage, role) {
      if (!currentPreview) return;
      const label = stage === 'article' ? '重写文章' : stage === 'images' ? '重生全部图片' : '重生 ' + role;
      if (!confirm('确认' + label + '？')) return;
      try {
        await submitJob('/api/history/' + currentPreview.history_id + '/regenerate', {stage, role});
      } catch (e) {
        showStatus('error', label + '失败：' + (e.message || e));
        setActions(true);
      }
    }

    async function openEditor() {
      if (!currentPreview) return;
      const resp = await fetch('/api/history/' + currentPreview.history_id + '/article');
      const data = await resp.json();
      if (!resp.ok || !data.ok) return showStatus('error', data.error || '读取正文失败');
      editor.value = data.markdown;
      frame.style.display = 'none';
      empty.style.display = 'none';
      editor.classList.add('show');
      $('btn-save-edit').style.display = '';
      $('btn-cancel-edit').style.display = '';
    }

    async function saveEditor() {
      if (!currentPreview) return;
      $('btn-save-edit').disabled = true;
      showStatus('info', '💾 保存并重新排版…');
      try {
        const resp = await fetch('/api/history/' + currentPreview.history_id + '/article', {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({markdown: editor.value}),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) throw new Error(data.error || '保存失败');
        currentPreview.topic.title = data.entry.title;
        setPreview(data.html_url, 0);
        setMeta(currentPreview);
        showStatus('success', 'Markdown 已保存，预览已更新。');
        await refreshHistory();
      } catch (e) {
        showStatus('error', e.message || e);
      } finally {
        $('btn-save-edit').disabled = false;
      }
    }

    async function applyTheme() {
      if (!currentPreview) return;
      showStatus('info', '🎨 正在应用主题…');
      const resp = await fetch('/api/history/' + currentPreview.history_id + '/theme', {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({theme: themeInput.value}),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) return showStatus('error', data.error || '主题更新失败');
      currentPreview.theme = data.entry.theme;
      setPreview(data.html_url, readIframeScroll());
      setMeta(currentPreview);
      showStatus('success', '主题已更新为 ' + currentPreview.theme);
    }

    async function showPreflight(display = true) {
      if (!currentPreview) return null;
      const resp = await fetch('/api/history/' + currentPreview.history_id + '/preflight');
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        showStatus('error', data.error || '发布前检查失败');
        return null;
      }
      const icons = {pass: '✅', warn: '⚠️', error: '❌'};
      const report = data.checks.map(item => icons[item.level] + ' ' + item.message).join('\n');
      if (display) {
        showStatus(data.publishable ? (data.checks.some(x => x.level === 'warn') ? 'warning' : 'success') : 'error', report);
      }
      return data;
    }

    async function doPublish() {
      if (!currentPreview) {
        showStatus('error', '请先生成预览或从历史中选择');
        return;
      }
      const readiness = await showPreflight(false);
      if (!readiness || !readiness.publishable) {
        if (readiness) {
          const failed = readiness.checks.filter(x => x.level === 'error').map(x => '❌ ' + x.message).join('\n');
          showStatus('error', '发布前检查未通过：\n' + failed);
        }
        return;
      }
      if (!confirm('确认推送到微信草稿箱？\n历史 # ' + currentPreview.history_id +
                  ' · ' + currentPreview.topic.id + ' · ' + currentPreview.topic.title)) {
        return;
      }
      btnPublish.disabled = true;
      btnPreview.disabled = true;
      showStatus('info', '🚀 正在推送…');
      try {
        const resp = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history_id: currentPreview.history_id }),
        });
        const data = await resp.json();
        if (data.ok) {
          showStatus('success', '✅ 推送成功\n' + (data.stdout || '').trim());
          await refreshHistory();
          await loadTopics();
        } else {
          let msg = '❌ 推送失败（returncode=' + data.returncode + '）';
          if (data.stderr && data.stderr.trim()) {
            msg += '\n' + data.stderr.trim();
          }
          if (data.stdout && data.stdout.trim()) {
            msg += '\n--- stdout ---\n' + data.stdout.trim();
          }
          showStatus('error', msg);
        }
      } catch (e) {
        showStatus('error', '请求失败：' + (e && e.message ? e.message : e));
      } finally {
        btnPublish.disabled = false;
        btnPreview.disabled = false;
      }
    }

    btnPreview.addEventListener('click', doPreview);
    btnPublish.addEventListener('click', doPublish);
    btnPreflight.addEventListener('click', showPreflight);
    btnEdit.addEventListener('click', openEditor);
    $('btn-save-edit').addEventListener('click', saveEditor);
    $('btn-cancel-edit').addEventListener('click', () => setPreview(currentPreview.html_url, 0));
    $('btn-regen-article').addEventListener('click', () => regenerate('article'));
    $('btn-regen-images').addEventListener('click', () => regenerate('images'));
    $('btn-regen-image').addEventListener('click', () => regenerate('image', $('image-role').value));
    $('btn-apply-theme').addEventListener('click', applyTheme);
    $('btn-new-topic').addEventListener('click', () => $('custom-topic-form').classList.toggle('show'));
    $('btn-cancel-topic').addEventListener('click', () => $('custom-topic-form').classList.remove('show'));
    $('btn-save-topic').addEventListener('click', saveCustomTopic);
    topicSearch.addEventListener('input', () => {
      clearTimeout(topicSearchTimer);
      topicSearchTimer = setTimeout(loadTopics, 250);
    });
    topicStatus.addEventListener('change', loadTopics);
    topicSource.addEventListener('change', loadTopics);
    topicCategory.addEventListener('change', loadTopics);
    loadTopics();
    refreshHistory();
    const activeJob = localStorage.getItem('wechat-studio-active-job');
    if (activeJob) pollJob(activeJob).catch(e => {
      localStorage.removeItem('wechat-studio-active-job');
      btnPreview.disabled = false;
      showStatus('error', '恢复任务失败：' + (e.message || e));
    });
  })();
  </script>
</body>
</html>
